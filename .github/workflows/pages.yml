# .github/workflows/pages.yml
# Builds the TSCG Compendium (read-only) + the simulation gallery, and deploys to
# GitHub Pages on push. One-time setup: Settings → Pages → Source = "GitHub Actions".
#
# The build reads from HEAD and writes only to dist/ — it never modifies source files.
# (Classification lives in the RULES of cli_tools/compendium/annotate_compendium.py:
#  edit a rule locally, review, commit. CI must not write back to source.)

name: Build & deploy Compendium

on:
  push:
    branches: [main]
  workflow_dispatch:

# Public base URL of the site — makes the gallery's sim links absolute.
# Adjust if you use a custom domain or a different repo name.
env:
  SITE_URL: "https://echopraxium.github.io/tscg"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Action versions: all on the node24 runtime (Node 20 runners deprecated, 2026-10-22).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the toolchain Python packages (LayerCake Health Map)
        run: python -m pip install -r ontology/toolchain/requirements.txt

      - uses: actions/setup-node@v5      # the simulation-gallery generator is Node (no deps)
        with:
          node-version: "22"

      - name: Build the Compendium (+ simulation gallery)
        run: |
          python cli_tools/compendium/build_compendium.py . \
            --template cli_tools/compendium/compendium_template.html \
            --gallery-script cli_tools/regenerate_simulation_gallery/generate_index.js \
            --site-url "${{ env.SITE_URL }}" \
            --out dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
