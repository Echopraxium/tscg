# .github/workflows/pages.yml
# Builds the TSCG Compendium (read-only) + the simulation gallery, and deploys to
# GitHub Pages on push. One-time setup: Settings → Pages → Source = "GitHub Actions".
#
# The build reads from HEAD and writes only to dist/ — it never modifies source files.
# (Classification lives in the RULES of cli_tools/compendium/annotate_compendium.py:
#  edit a rule locally, review, commit. CI must not write back to source.)
#
# Job `checks` (2026-11-15, WS-14): checks that can fail, run in parallel with the build.
# A failure turns the run red but never blocks the deployment: the site still shows the
# last good state, with "N/A" and the reason where a generator failed.
#   - worksite_graph.py --check : depends_on of every worksite.yaml (unknown id, kind, cycle)
#   - check_laws.js             : no physics outside K.LAWS in the Kit workshops
#   - attribution trailers      : no "Co-Authored-By: Claude" / "Claude-Session:" in any commit
#                                 message of the history (CLAUDE.md, Authorship)

name: Build & deploy Compendium

on:
  push:
    branches: [main]
  workflow_dispatch:

# Public base URL of the site — makes the gallery's sim links absolute.
# Adjust if you use a custom domain or a different repo name.
env:
  SITE_URL: "https://echopraxium.github.io/tscg"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Action versions: all on the node24 runtime (Node 20 runners deprecated, 2026-10-22).
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # the whole history, for the attribution-trailer check

      - name: Commit messages — no Claude attribution trailer (CLAUDE.md, Authorship)
        run: |
          bad=$(git log --format='%h %s%n%b' | grep -ciE '^(Co-Authored-By:.*(claude|anthropic)|Claude-Session:)' || true)
          if [ "$bad" != "0" ]; then
            echo "::error::$bad attribution trailer line(s) in the history of main:"
            git log --format='%h %s' -iE --grep='^(Co-Authored-By:.*(claude|anthropic)|Claude-Session:)' | head -20
            exit 1
          fi
          echo "no attribution trailer in $(git rev-list --count HEAD) commits"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML (worksite.yaml loader)
        run: python -m pip install "PyYAML>=6.0"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Worksites dependency graph — depends_on integrity
        working-directory: ontology/toolchain
        run: python worksite_graph.py --check

      - name: Kit — no law recomputed outside K.LAWS
        run: node kit/tools/check_laws.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the toolchain Python packages (LayerCake Health Map, worksites graph)
        run: python -m pip install -r ontology/toolchain/requirements.txt

      - uses: actions/setup-node@v5      # the simulation-gallery generator is Node (no deps)
        with:
          node-version: "22"

      - name: Build the Compendium (+ simulation gallery, health map, worksites dependency graph)
        run: |
          python cli_tools/compendium/build_compendium.py . \
            --template cli_tools/compendium/compendium_template.html \
            --gallery-script cli_tools/regenerate_simulation_gallery/generate_index.js \
            --site-url "${{ env.SITE_URL }}" \
            --out dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
