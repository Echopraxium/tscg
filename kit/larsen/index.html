<body>
<script>
/* ../lib/sim.js */
/* TSCG Kit — sim.js
 * Generic pieces and the fixed-step simulation.
 * The graph (nodes + wires) is the single source of truth: the Panneau and the
 * Maquette only read it (and write parameters through bindings).
 * Time is in the workshop's own unit (hours, seconds…): model.step(dt).
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";

  // Behaviour lives in the generic kind; a workshop gives each piece a "skin"
  // (name, port labels, parameters) on top of one of these kinds.
  const KINDS = {
    storage:    { inputs:  [{ id: "in", kind: "flux", multi: true }],
                  outputs: [{ id: "out", kind: "flux" }, { id: "level", kind: "info" }] },
    sink:       { inputs:  [{ id: "in", kind: "flux", multi: true }], outputs: [] },
    source:     { inputs:  [{ id: "cmd", kind: "info" }], outputs: [{ id: "flow", kind: "flux" }] },
    threshold:  { inputs:  [{ id: "x", kind: "info" }], outputs: [{ id: "u", kind: "info" }] },
    amplify:    { inputs:  [{ id: "x", kind: "info" }], outputs: [{ id: "y", kind: "info" }] },
    transducer: { inputs:  [{ id: "x", kind: "info" }], outputs: [{ id: "flow", kind: "flux" }] },
    gradient:   { inputs:  [{ id: "a", kind: "info", multi: true }, { id: "b", kind: "info" }], outputs: [{ id: "d", kind: "info" }] },
    clock:      { inputs:  [], outputs: [{ id: "out", kind: "info" }] }
  };
  const GENERIC = { storage: "Storage", sink: "Sink", source: "Source", threshold: "Threshold (hystérésis)",
                    amplify: "Amplification", transducer: "Transducer", gradient: "Gradient (écart)", clock: "Clock (rythme)" };
  const INFO_ORDER = ["clock", "gradient", "amplify", "threshold"];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const noise = a => a ? a * (Math.random() * 2 - 1) : 0;
  // repeatable pseudo-random number in [0,1) for day i (irregular days)
  const hash01 = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  class Model {
    constructor(skins) {
      this.skins = skins;
      this.nodes = []; this.wires = []; this.nextId = 1;
      this.t = 0; this.steps = 0; this.history = [];
      this.env = { night: false };
      this.listeners = new Set();
    }
    on(fn) { this.listeners.add(fn); }
    emit(type, detail) { for (const fn of this.listeners) fn(type, detail); }

    kindOf(n) { return this.skins[n.type].kind; }
    ports(n, side) { return KINDS[this.kindOf(n)][side === "in" ? "inputs" : "outputs"]; }
    byId(id) { return this.nodes.find(n => n.id === id); }
    first(type) { return this.nodes.find(n => n.type === type); }
    wiresTo(id, port) { return this.wires.filter(w => w.to.node === id && (!port || w.to.port === port)); }
    wiresFrom(id, port) { return this.wires.filter(w => w.from.node === id && (!port || w.from.port === port)); }
    linked(fromType, fromPort, toType, toPort) {
      return this.wires.some(w => this.byId(w.from.node).type === fromType && w.from.port === fromPort &&
                                  this.byId(w.to.node).type === toType && w.to.port === toPort);
    }

    addNode(type, x, y) {
      const n = { id: this.nextId++, type, x, y, p: {} };
      const ps = this.skins[type].params || {};
      for (const k in ps) n.p[k] = ps[k].v;
      this.resetNode(n);
      this.nodes.push(n);
      this.emit("node_add", type);
      return n;
    }
    removeNode(id) {
      const n = this.byId(id); if (!n) return;
      this.nodes = this.nodes.filter(m => m.id !== id);
      this.wires = this.wires.filter(w => w.from.node !== id && w.to.node !== id);
      this.emit("node_delete", n.type);
    }
    // Returns {ok:true, wire} or {ok:false, reason}. Ports must carry the same kind.
    connect(from, to) {
      const a = this.byId(from.node), b = this.byId(to.node);
      if (!a || !b) return { ok: false, reason: "missing" };
      if (a === b) return { ok: false, reason: "self" };
      const qo = this.ports(a, "out").find(q => q.id === from.port);
      const qi = this.ports(b, "in").find(q => q.id === to.port);
      if (!qo || !qi) return { ok: false, reason: "port" };
      if (qo.kind !== qi.kind) return { ok: false, reason: qo.kind === "flux" ? "flux_to_info" : "info_to_flux" };
      const dup = this.wires.find(w => w.from.node === a.id && w.from.port === from.port && w.to.node === b.id && w.to.port === to.port);
      if (dup) return { ok: true, wire: dup };
      if (!qi.multi) this.wires = this.wires.filter(w => !(w.to.node === b.id && w.to.port === to.port));
      const w = { id: this.nextId++, from: { node: a.id, port: from.port }, to: { node: b.id, port: to.port }, kind: qo.kind, power: 0 };
      this.wires.push(w);
      this.emit("wire_add", `${a.type}.${from.port} -> ${b.type}.${to.port}`);
      return { ok: true, wire: w };
    }
    removeWire(id) {
      this.wires = this.wires.filter(w => w.id !== id);
      this.emit("wire_delete", id);
    }

    resetNode(n) {
      const k = this.kindOf(n), keep = n.s || {};
      if (k === "storage") n.s = { x: n.p.x0 };
      else if (k === "source") n.s = { u: 0, manual: keep.manual || 0 };
      else if (k === "threshold") n.s = { u: 1, x: null };
      else if (k === "amplify") n.s = { y: 0, sat: 0 };
      else if (k === "transducer") n.s = { flow: 0, att: keep.att === undefined ? 1 : keep.att };
      else if (k === "gradient") n.s = { d: 0, a: null };
      else if (k === "clock") n.s = { v: null, day: false };
      else n.s = { open: !!keep.open };
    }
    resetAll() { this.t = 0; this.steps = 0; this.history = []; this.nodes.forEach(n => this.resetNode(n)); this.evalInfo(); }

    // The value a node presents on its information output (null = nothing to say).
    infoOut(src) {
      const k = this.kindOf(src);
      if (k === "storage") return src.s.x;
      if (k === "threshold") return src.s.x === null ? 0 : src.s.u;
      if (k === "amplify") return src.s.y;
      if (k === "gradient") return src.s.d;
      if (k === "clock") return src.s.v;
      return null;
    }
    // Value arriving on an information input. A multi input takes the first source that
    // speaks; sources whose skin says `fallback` speak only when no other one does.
    infoIn(n, port) {
      const ws = this.wiresTo(n.id, port);
      if (!ws.length) return null;
      const srcs = ws.map(w => this.byId(w.from.node));
      const ordered = srcs.filter(s => !this.skins[s.type].fallback).concat(srcs.filter(s => this.skins[s.type].fallback));
      for (const s of ordered) { const v = this.infoOut(s); if (v !== null && v !== undefined) return v; }
      return null;
    }

    clockValue(n) {
      const s = this.skins[n.type], t = this.t;
      if (s.mode === "fixed") return { v: n.p.angle, day: true };
      const day = Math.floor(t / 24), h = t - day * 24;
      if (s.mode === "sun") {
        const L = clamp(12 + (n.p.irr || 0) * (hash01(day) * 2 - 1) * 6, 4, 20);
        const rise = 12 - L / 2, set = 12 + L / 2;
        return h >= rise && h < set ? { v: -90 + 180 * (h - rise) / L, day: true } : { v: null, day: false };
      }
      if (s.mode === "night") {          // an internal rhythm on a fixed 24 h schedule: speaks from p.from to p.to (hours)
        const from = n.p.from === undefined ? 18 : n.p.from, to = n.p.to === undefined ? 6 : n.p.to;
        const on = from < to ? (h >= from && h < to) : (h >= from || h < to);
        return { v: on ? n.p.angle : null, day: !on };
      }
      return { v: null, day: false };
    }
    evalInfo() {
      for (let pass = 0; pass < 3; pass++) {
        for (const kind of INFO_ORDER) for (const n of this.nodes) {
          if (this.kindOf(n) !== kind) continue;
          if (kind === "clock") Object.assign(n.s, this.clockValue(n));
          else if (kind === "gradient") {
            const a = this.infoIn(n, "a"), b = this.infoIn(n, "b");
            n.s.a = a;
            if (pass === 2) n.s.d = a === null || b === null ? 0 : a - b + noise(n.p.noise);
            else n.s.d = a === null || b === null ? 0 : a - b;
          } else if (kind === "amplify") {
            const x = this.infoIn(n, "x") || 0, raw = n.p.gain * x;
            n.s.y = clamp(raw, -n.p.max, n.p.max); n.s.sat = Math.abs(raw) >= n.p.max ? 1 : 0;
          } else if (kind === "threshold" && pass === 2) {
            const x = this.infoIn(n, "x"); n.s.x = x;
            if (x !== null) {
              if (x < n.p.set - n.p.h / 2) n.s.u = 1;
              else if (x > n.p.set + n.p.h / 2) n.s.u = 0;
            }
          }
        }
      }
      const sun = this.nodes.find(n => this.kindOf(n) === "clock" && this.skins[n.type].mode === "sun");
      this.env.night = sun ? !sun.s.day : false;
    }

    // One step of dt (workshop time unit).
    step(dt) {
      this.evalInfo();
      for (const n of this.nodes) {
        const k = this.kindOf(n);
        if (k === "source") { const cmd = this.infoIn(n, "cmd"); n.s.u = cmd === null ? n.s.manual : (cmd >= 0.5 ? 1 : 0); }
        if (k === "transducer") {
          const x = this.infoIn(n, "x") || 0;
          n.s.flow = clamp(n.p.k * n.s.att * x, -n.p.max, n.p.max) + noise(n.p.noise);
        }
      }
      const net = new Map();
      for (const w of this.wires) {
        if (w.kind !== "flux") continue;
        const a = this.byId(w.from.node), b = this.byId(w.to.node);
        const ka = this.kindOf(a), kb = this.kindOf(b);
        let p = 0;
        if (ka === "source") p = a.s.u * a.p.P / Math.max(1, this.wiresFrom(a.id, "flow").length);
        else if (ka === "transducer") p = a.s.flow / Math.max(1, this.wiresFrom(a.id, "flow").length);
        else if (ka === "storage") {
          const target = kb === "storage" ? b.s.x : kb === "sink" ? b.p.level : null;
          const g = a.p.k + (kb === "sink" && b.s.open ? (b.p.kOpen || 0) : 0);
          if (target !== null) p = g * (a.s.x - target);
        }
        w.power = p;
        if (ka === "storage") net.set(a.id, (net.get(a.id) || 0) - p);
        if (kb === "storage") net.set(b.id, (net.get(b.id) || 0) + p);
      }
      for (const n of this.nodes) {
        if (this.kindOf(n) !== "storage") continue;
        n.s.x += dt * ((net.get(n.id) || 0) + (n.p.base || 0)) / n.p.C;
        if (n.p.decay) n.s.x /= 1 + dt * n.p.decay;          // implicit: steady state = inflow / decay
        if (n.p.lo !== undefined) n.s.x = Math.max(n.p.lo, n.s.x);
        if (n.p.hi !== undefined) n.s.x = Math.min(n.p.hi, n.s.x);
      }
      this.t += dt; this.steps++;
      this.evalInfo();
      const snap = { t: this.t, v: {}, u: {}, open: false, night: this.env.night };
      for (const n of this.nodes) {
        const k = this.kindOf(n);
        if (k === "source") snap.u[n.id] = n.s.u;
        else if (k === "sink") { if (n.s.open) snap.open = true; }
        else if (k === "transducer") snap.v[n.id] = n.s.flow;
        else snap.v[n.id] = this.infoOut(n);
        if (k === "amplify") snap.u[n.id] = n.s.sat;
      }
      this.history.push(snap);
      if (this.history.length > 2000) this.history.shift();
    }

    // ---- bindings, used by the Panneau: {piece, get} | {piece, set:"manual"} | {piece, param}
    isAuto(bind) {
      const n = this.first(bind.piece);
      return !!(n && bind.set === "manual" && this.wiresTo(n.id, "cmd").length);
    }
    read(bind) {
      const n = this.first(bind.piece);
      if (!n) return null;
      if (bind.get === "level") return n.s.x;
      if (bind.get === "u") return n.s.x === null ? null : n.s.u;
      if (bind.get) { const v = n.s[bind.get]; return v === undefined ? null : (typeof v === "boolean" ? (v ? 1 : 0) : v); }
      if (bind.set === "manual") return this.isAuto(bind) ? n.s.u : n.s.manual;
      if (bind.param) return n.p[bind.param];
      return null;
    }
    write(bind, v) {
      const n = this.first(bind.piece);
      if (!n) return false;
      if (bind.set === "manual") {
        if (this.isAuto(bind)) return false;
        n.s.manual = v ? 1 : 0; n.s.u = n.s.manual; return true;
      }
      if (bind.param) {
        const d = (this.skins[n.type].params || {})[bind.param] || {};
        if (d.min !== undefined) v = Math.max(d.min, v);
        if (d.max !== undefined) v = Math.min(d.max, v);
        n.p[bind.param] = v; return true;
      }
      return false;
    }

    serialize() {
      return {
        nodes: this.nodes.map(n => ({ id: n.id, type: n.type, x: Math.round(n.x), y: Math.round(n.y), p: Object.assign({}, n.p) })),
        wires: this.wires.map(w => ({ from: w.from, to: w.to, kind: w.kind }))
      };
    }
  }

  K.KINDS = KINDS;
  K.GENERIC = GENERIC;
  K.Model = Model;
  K.fmtClock = m => `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, "0")}`;
  // default workshop clock: hours, one step = one minute
  K.CLOCK_HOURS = { dt: 1 / 60, stepsPerSec: 5, fmt: t => K.fmtClock(Math.round(t * 60)), fmtSteps: n => K.fmtClock(n) };
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* ../lib/synoptic.js */
/* TSCG Kit — synoptic.js
 * The Synoptique: an SVG node editor over the Model. Pieces are added from a
 * palette, moved by their title bar, and wired from an output (right) to an
 * input (left) of the same kind. Selecting a piece shows its parameters.
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const NW = 176, HEAD = 34, ROW = 24;
  const REJECT = {
    self: "Une pièce ne se branche pas sur elle-même.",
    flux_to_info: "Un flux (orange) ne se branche que sur une entrée de flux.",
    info_to_flux: "Une information (bleu) ne se branche que sur une entrée d'information."
  };
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  class Synoptic {
    // o: { order, home, fluxLabel, isUnlocked(type), hood(), toast(msg), onChange() }
    constructor(host, model, o) {
      this.m = model; this.o = o;
      this.selected = null; this.drag = null; this.dragWire = null; this.live = [];
      host.innerHTML =
        `<div class="sy-palette"><h2 class="k-h2">Pièces</h2><div class="sy-list"></div>
           <div class="sy-legend"><div><i style="background:var(--flux)"></i>${o.fluxLabel || "flux"}</div>
           <div><i style="background:var(--info)"></i>information</div>
           <p>Tire un fil d'une sortie (à droite d'une pièce) vers une entrée (à gauche) de la même couleur.</p></div></div>
         <div class="sy-stage"><svg class="sy-svg" aria-label="Synoptique : pièces et fils"></svg><div class="sy-params"></div></div>`;
      this.host = host;
      this.svg = host.querySelector(".sy-svg");
      this.list = host.querySelector(".sy-list");
      this.params = host.querySelector(".sy-params");
      this.svg.addEventListener("pointerdown", e => { if (e.target === this.svg) this.select(null); });
      window.addEventListener("pointermove", e => this.onMove(e));
      window.addEventListener("pointerup", e => this.onUp(e));
    }
    skin(n) { return this.m.skins[n.type]; }
    nodeHeight(n) {
      const rows = Math.max(this.m.ports(n, "in").length, this.m.ports(n, "out").length, 1);
      return HEAD + 10 + rows * ROW + 30;
    }
    portPos(n, port, side) {
      const i = this.m.ports(n, side).findIndex(q => q.id === port);
      return { x: n.x + (side === "in" ? 0 : NW), y: n.y + HEAD + 18 + i * ROW };
    }
    // Forward wires are curves; a wire going back to the left is routed below both pieces.
    wirePath(a, b, na, nb, k) {
      if (b.x >= a.x + 12 || !na || !nb) {
        const dx = Math.max(50, Math.abs(b.x - a.x) / 2);
        return `M${a.x} ${a.y} C${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`;
      }
      const lane = Math.max(na.y + this.nodeHeight(na), nb.y + this.nodeHeight(nb)) + 22 + 14 * k, r = 10;
      const xr = a.x + 24 + 10 * k, xl = Math.max(6 + 4 * k, b.x - 24 - 10 * k);
      return `M${a.x} ${a.y} H${xr - r} Q${xr} ${a.y} ${xr} ${a.y + r} V${lane - r} Q${xr} ${lane} ${xr - r} ${lane}` +
             ` H${xl + r} Q${xl} ${lane} ${xl} ${lane - r} V${b.y + r} Q${xl} ${b.y} ${xl + r} ${b.y} H${b.x}`;
    }

    renderPalette() {
      this.list.textContent = "";
      for (const t of this.o.order) {
        const s = this.m.skins[t], open = this.o.isUnlocked(t);
        const b = document.createElement("button");
        b.className = "sy-piece"; b.disabled = !open; b.dataset.piece = t;
        b.innerHTML = `${s.name}<small>${open ? (this.o.hood() ? K.GENERIC[s.kind] : s.blurb) : "verrouillée"}</small>`;
        b.onclick = () => this.add(t);
        this.list.appendChild(b);
      }
    }

    render() {
      const svg = this.svg, m = this.m;
      svg.textContent = ""; this.live = [];
      const gW = el("g", {}, svg), gN = el("g", {}, svg);
      let back = 0;
      for (const w of m.wires) {
        const na = m.byId(w.from.node), nb = m.byId(w.to.node);
        const a = this.portPos(na, w.from.port, "out"), b = this.portPos(nb, w.to.port, "in");
        const d = this.wirePath(a, b, na, nb, b.x < a.x + 12 ? back++ : 0);
        const path = el("path", { d, class: `wire ${w.kind}${this.selected === "w" + w.id ? " selected" : ""}` }, gW);
        const hit = el("path", { d, class: "wire-hit" }, gW);
        hit.addEventListener("pointerdown", e => { e.stopPropagation(); this.select("w" + w.id); });
        this.live.push({ wire: w, path });
      }
      for (const n of m.nodes) {
        const s = this.skin(n), h = this.nodeHeight(n), hood = this.o.hood();
        const g = el("g", { class: "node" + (this.selected === "n" + n.id ? " selected" : ""), transform: `translate(${n.x},${n.y})`, "data-node": n.id }, gN);
        el("rect", { class: "node-body", width: NW, height: h, rx: 10 }, g);
        const head = el("path", { class: "node-head", d: `M0 10 Q0 0 10 0 H${NW - 10} Q${NW} 0 ${NW} 10 V${HEAD} H0 Z` }, g);
        const title = el("text", { class: "node-title", x: 12, y: hood ? 16 : 22 }, g); title.textContent = s.name;
        if (hood) el("text", { class: "node-gen", x: 12, y: 29 }, g).textContent = K.GENERIC[s.kind];
        for (const part of [head, title]) { part.style.cursor = "grab"; part.addEventListener("pointerdown", e => this.startDrag(e, n)); }
        g.addEventListener("pointerdown", e => { if (!e.defaultPrevented) this.select("n" + n.id); });
        m.ports(n, "in").forEach((q, i) => {
          const y = HEAD + 18 + i * ROW;
          el("circle", { class: `port ${q.kind}`, cx: 0, cy: y, r: 7, "data-node": n.id, "data-port": q.id, "data-side": "in" }, g);
          el("text", { class: "port-label", x: 12, y: y + 4 }, g).textContent = (s.ports || {})[q.id] !== undefined ? s.ports[q.id] : q.id;
        });
        m.ports(n, "out").forEach((q, i) => {
          const y = HEAD + 18 + i * ROW;
          const c = el("circle", { class: `port ${q.kind}`, cx: NW, cy: y, r: 7, "data-node": n.id, "data-port": q.id, "data-side": "out" }, g);
          c.addEventListener("pointerdown", e => this.startWire(e, n, q));
          el("text", { class: "port-label", x: NW - 12, y: y + 4, "text-anchor": "end" }, g).textContent = (s.ports || {})[q.id] !== undefined ? s.ports[q.id] : q.id;
        });
        const rows = Math.max(m.ports(n, "in").length, m.ports(n, "out").length, 1);
        const val = el("text", { class: "node-value", x: 12, y: HEAD + 10 + rows * ROW + 14 }, g);
        this.live.push({ node: n, val });
      }
      if (this.dragWire) {
        this.dragWire.path = el("path", { class: `wire ${this.dragWire.kind}`, d: "" }, svg);
        this.dragWire.path.style.pointerEvents = "none";
      }
      this.update(false);
    }

    describe(n) {
      const s = this.skin(n), k = this.m.kindOf(n);
      if (s.describe) return s.describe(n, this.m);
      if (k === "storage") return n.s.x.toFixed(1) + " " + (s.unit || "");
      if (k === "sink") return (s.levelText || "niveau") + " : " + n.p.level + " " + (s.unit || "");
      if (k === "source") return n.s.u ? (s.onText || "marche") : (s.offText || "arrêt");
      if (k === "threshold") return n.s.x === null ? "non relié" : (n.s.u ? (s.onText || "fermé") : (s.offText || "ouvert"));
      if (k === "amplify") return (n.s.sat ? "saturé · " : "") + "sortie " + n.s.y.toFixed(1);
      if (k === "transducer") return n.s.flow.toFixed(1) + " " + (s.unit || "");
      if (k === "gradient") return n.s.a === null ? "rien à viser" : "écart " + n.s.d.toFixed(0) + " " + (s.unit || "");
      if (k === "clock") return n.s.v === null ? (s.offText || "—") : (s.onText || "") + " " + n.s.v.toFixed(0) + " " + (s.unit || "");
      return "";
    }
    update(running) {
      for (const r of this.live) {
        if (r.wire) { r.path.classList.toggle("active", r.wire.kind === "flux" && running && Math.abs(r.wire.power || 0) > 0.01); continue; }
        r.val.textContent = this.describe(r.node);
      }
    }

    point(e) { const r = this.svg.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    startDrag(e, n) {
      e.preventDefault(); e.stopPropagation(); this.select("n" + n.id);
      const p = this.point(e); this.drag = { n, dx: p.x - n.x, dy: p.y - n.y };
    }
    startWire(e, n, q) {
      e.preventDefault(); e.stopPropagation();
      this.dragWire = { from: { node: n.id, port: q.id }, kind: q.kind };
      this.render();
    }
    onMove(e) {
      if (this.drag) {
        const p = this.point(e), r = this.svg.getBoundingClientRect(), n = this.drag.n;
        n.x = Math.max(4, Math.min(r.width - NW - 4, p.x - this.drag.dx));
        n.y = Math.max(4, Math.min(r.height - 40, p.y - this.drag.dy));
        this.render();
      } else if (this.dragWire && this.dragWire.path) {
        const a = this.portPos(this.m.byId(this.dragWire.from.node), this.dragWire.from.port, "out");
        this.dragWire.path.setAttribute("d", this.wirePath(a, this.point(e)));
      }
    }
    onUp(e) {
      if (this.drag) { this.drag = null; return; }
      if (!this.dragWire) return;
      const dw = this.dragWire; this.dragWire = null;
      const t = document.elementFromPoint(e.clientX, e.clientY);
      if (t && t.dataset && t.dataset.side === "in") this.connect(dw.from, { node: +t.dataset.node, port: t.dataset.port });
      this.render();
    }
    connect(from, to) {
      const r = this.m.connect(from, to);
      if (!r.ok && REJECT[r.reason]) { this.o.toast(REJECT[r.reason]); this.m.emit("wire_reject", r.reason); }
      this.render(); this.o.onChange();
      return r;
    }
    add(type) {
      // home positions are designed for a wide stage; squeeze them horizontally to fit this one
      const r = this.svg.getBoundingClientRect(), homes = this.o.home || {}, home = homes[type] || { x: 40, y: 40 };
      const maxX = Math.max(1, ...Object.values(homes).map(h => h.x));
      const scale = r.width ? Math.min(1, (r.width - NW - 12) / maxX) : 1;
      let x = Math.round(home.x * scale), y = home.y;
      while (this.m.nodes.some(n => Math.abs(n.x - x) < 30 && Math.abs(n.y - y) < 30)) { x += 30; y += 30; }
      if (r.width) x = Math.max(8, Math.min(x, r.width - NW - 8));
      const n = this.m.addNode(type, x, y);
      this.select("n" + n.id); this.o.onChange();
      return n;
    }
    deleteSelected() {
      if (!this.selected) return;
      const id = +this.selected.slice(1);
      if (this.selected[0] === "n") this.m.removeNode(id); else this.m.removeWire(id);
      this.selected = null; this.render(); this.renderParams(); this.o.onChange();
    }
    select(key) { this.selected = key; this.render(); this.renderParams(); }

    renderParams() {
      const box = this.params;
      if (!this.selected) { box.innerHTML = `<span class="k-muted">Clique une pièce pour la régler. Touche Suppr pour enlever une pièce ou un fil.</span>`; return; }
      if (this.selected[0] === "w") { box.innerHTML = `<span>Fil sélectionné.</span><button class="sy-del">Supprimer le fil</button>`; box.querySelector(".sy-del").onclick = () => this.deleteSelected(); return; }
      const n = this.m.byId(+this.selected.slice(1)); if (!n) return;
      const s = this.skin(n), ps = s.params || {};
      box.innerHTML = `<b>${s.name}</b>${this.o.hood() ? ` <span class="k-muted">· ${K.GENERIC[s.kind]}</span>` : ""}` +
        Object.entries(ps).filter(([k, d]) => !d.hidden).map(([k, d]) => `<label>${d.label}<input type="number" data-k="${k}" step="${d.step}"${d.min !== undefined ? ` min="${d.min}"` : ""}${d.max !== undefined ? ` max="${d.max}"` : ""} value="${n.p[k]}"></label>`).join("") +
        `<button class="sy-del">Supprimer la pièce</button>`;
      box.querySelectorAll("input").forEach(inp => inp.onchange = () => {
        const d = ps[inp.dataset.k]; let v = parseFloat(inp.value);
        if (!isFinite(v)) v = d.v;
        this.m.write({ piece: n.type, param: inp.dataset.k }, v);
        inp.value = n.p[inp.dataset.k];
        this.m.emit("param", `${n.type}.${inp.dataset.k}=${n.p[inp.dataset.k]}`);
      });
      box.querySelector(".sy-del").onclick = () => this.deleteSelected();
    }
  }

  K.Synoptic = Synoptic;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* ../lib/panel.js */
/* TSCG Kit — panel.js
 * The Panneau: instruments laid out on a grid, LEGO-style. Every instrument
 * keeps one side fixed so the panel packs like Tetris:
 *   lamp   2×2 (square)     toggle 3×2
 *   gauge  2×len            slider 2×len   (len 3..10, vertical or horizontal)
 * Instruments are bound to the graph (read a level, write a parameter); they
 * never hold a model of their own.
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  const U = 36;                                   // grid unit, px
  const LEN_MIN = 3, LEN_MAX = 10;
  const DEFAULTS = { gauge: { orient: "v", len: 5 }, slider: { orient: "h", len: 5 }, toggle: { orient: "h", len: 0 }, lamp: { orient: "h", len: 0 } };
  const ICON = { gauge: "▮", slider: "⎯●", toggle: "⏻", lamp: "●" };
  function foot(c) {
    if (c.type === "lamp") return { w: 2, h: 2 };
    if (c.type === "toggle") return { w: 3, h: 2 };
    return c.orient === "v" ? { w: 2, h: c.len } : { w: c.len, h: 2 };
  }
  const resizable = c => c.type === "gauge" || c.type === "slider";

  class Panel {
    // o: { instruments, skins, isUnlocked(key), toast(msg), log(type, detail), onChange() }
    constructor(host, model, o) {
      this.m = model; this.o = o; this.controls = []; this.nextId = 1; this.els = new Map();
      host.innerHTML =
        `<div class="pn-toolbar"><span class="pn-tb-label">Ajouter un instrument :</span><span class="pn-tb-list"></span></div>
         <div class="pn-scroll"><div class="pn-grid"><div class="pn-empty">Le panneau est vide. Ajoute un instrument avec les boutons ci-dessus.</div></div></div>`;
      this.tb = host.querySelector(".pn-tb-list");
      this.grid = host.querySelector(".pn-grid");
      this.empty = host.querySelector(".pn-empty");
      this.grid.style.setProperty("--u", U + "px");
    }
    def(c) { return this.o.instruments[c.inst]; }
    has(key) { return this.controls.some(c => c.inst === key); }
    cols() { return Math.max(8, Math.floor(this.grid.clientWidth / U)); }

    renderToolbar() {
      this.tb.textContent = "";
      let any = false;
      for (const key in this.o.instruments) {
        if (!this.o.isUnlocked(key)) continue;
        any = true;
        const d = this.o.instruments[key], piece = this.o.skins[d.bind.piece];
        const present = this.has(key), avail = !!this.m.first(d.bind.piece);
        const b = document.createElement("button");
        b.className = "pn-add"; b.dataset.inst = key;
        b.innerHTML = `<span class="pn-ico">${ICON[d.type]}</span>${d.label}`;
        b.disabled = present || !avail;
        b.title = present ? "Déjà sur le panneau" : !avail ? `Pose d'abord un(e) ${piece.name} dans le Synoptique` : "Ajouter au panneau";
        b.onclick = () => this.add(key);
        this.tb.appendChild(b);
      }
      if (!any) this.tb.innerHTML = `<span class="k-muted">aucun pour l'instant</span>`;
    }

    fits(c, x, y, f) {
      if (x < 0 || y < 0 || x + f.w > this.cols()) return false;
      for (const o of this.controls) {
        if (o === c) continue;
        const g = foot(o);
        if (x < o.x + g.w && o.x < x + f.w && y < o.y + g.h && o.y < y + f.h) return false;
      }
      return true;
    }
    firstFree(c, f) {
      for (let y = 0; y < 400; y++) for (let x = 0; x + f.w <= this.cols(); x++) if (this.fits(c, x, y, f)) return { x, y };
      return { x: 0, y: 0 };
    }
    add(key) {
      const d = this.o.instruments[key], df = DEFAULTS[d.type];
      const c = { id: this.nextId++, inst: key, type: d.type, orient: d.orient || df.orient, len: d.len || df.len, x: 0, y: 0 };
      Object.assign(c, this.firstFree(c, foot(c)));
      this.controls.push(c);
      this.o.log("panel_add", key);
      this.render(); this.o.onChange();
      return c;
    }
    remove(c) {
      this.controls = this.controls.filter(o => o !== c);
      this.o.log("panel_remove", c.inst);
      this.render(); this.o.onChange();
    }
    rotate(c) {
      const turned = Object.assign({}, c, { orient: c.orient === "v" ? "h" : "v" });
      const f = foot(turned);
      const pos = this.fits(c, c.x, c.y, f) ? { x: c.x, y: c.y } : this.firstFree(c, f);
      Object.assign(c, { orient: turned.orient }, pos);
      this.o.log("panel_rotate", `${c.inst}:${c.orient}`);
      this.render();
    }

    place(node, c, x, y) {
      const f = foot(c);
      node.style.left = (x * U + 2) + "px"; node.style.top = (y * U + 2) + "px";
      node.style.width = (f.w * U - 4) + "px"; node.style.height = (f.h * U - 4) + "px";
    }
    render() {
      this.renderToolbar();
      this.grid.querySelectorAll(".pn-ctl").forEach(n => n.remove());
      this.els.clear();
      this.empty.style.display = this.controls.length ? "none" : "";
      let rows = 6;
      for (const c of this.controls) { rows = Math.max(rows, c.y + foot(c).h + 2); this.grid.appendChild(this.make(c)); }
      this.grid.style.minHeight = (rows * U) + "px";
      this.update();
    }

    make(c) {
      const d = this.def(c);
      const node = document.createElement("div");
      node.className = `pn-ctl pn-${c.type} ${c.orient}`;
      node.dataset.inst = c.inst;
      node.title = d.label;
      node.innerHTML =
        `<div class="pn-head"><span class="pn-label">${d.short}</span><span class="pn-tools">` +
        (resizable(c) ? `<button class="pn-rot" title="Pivoter">⟳</button>` : "") +
        `<button class="pn-del" title="Retirer du panneau">×</button></span></div><div class="pn-body"></div>` +
        (resizable(c) ? `<div class="pn-resize" title="Étirer"></div>` : "");
      const body = node.querySelector(".pn-body"), refs = { node };
      if (c.type === "gauge" || c.type === "slider") {
        body.innerHTML = `<div class="pn-track">${d.zone ? `<div class="pn-zone"></div>` : ""}<div class="pn-fill"></div>${c.type === "slider" ? `<div class="pn-knob"></div>` : ""}</div><span class="pn-val"></span>`;
        refs.track = body.querySelector(".pn-track"); refs.fill = body.querySelector(".pn-fill");
        refs.val = body.querySelector(".pn-val"); refs.knob = body.querySelector(".pn-knob");
        if (d.zone) this.setBar(body.querySelector(".pn-zone"), c, this.frac(d, d.zone[0]), this.frac(d, d.zone[1]));
        if (c.type === "slider") refs.track.addEventListener("pointerdown", e => this.startSlide(e, c, refs.track));
      } else if (c.type === "toggle") {
        body.innerHTML = `<button class="pn-switch"><span class="pn-switch-dot"></span><span class="pn-switch-txt"></span></button>`;
        refs.sw = body.querySelector(".pn-switch"); refs.swTxt = body.querySelector(".pn-switch-txt");
        refs.sw.addEventListener("click", () => this.flip(c));
      } else if (c.type === "lamp") {
        body.innerHTML = `<span class="pn-bulb"></span>`;
        refs.lamp = body.querySelector(".pn-bulb");
      }
      node.querySelector(".pn-head").addEventListener("pointerdown", e => { if (!e.target.closest("button")) this.startMove(e, c, node); });
      node.querySelector(".pn-del").addEventListener("click", () => this.remove(c));
      const rot = node.querySelector(".pn-rot"); if (rot) rot.addEventListener("click", () => this.rotate(c));
      const rs = node.querySelector(".pn-resize"); if (rs) rs.addEventListener("pointerdown", e => this.startResize(e, c, node));
      this.place(node, c, c.x, c.y);
      this.els.set(c.id, refs);
      return node;
    }

    frac(d, v) { return Math.max(0, Math.min(1, (v - d.range[0]) / (d.range[1] - d.range[0]))); }
    setBar(bar, c, a, b) {               // a..b as fractions of the track
      if (b < a) { const t = a; a = b; b = t; }
      if (c.orient === "v") { bar.style.bottom = (a * 100) + "%"; bar.style.height = ((b - a) * 100) + "%"; bar.style.left = "0"; bar.style.right = "0"; }
      else { bar.style.left = (a * 100) + "%"; bar.style.width = ((b - a) * 100) + "%"; bar.style.top = "0"; bar.style.bottom = "0"; }
    }
    update() {
      for (const c of this.controls) {
        const r = this.els.get(c.id); if (!r) continue;
        const d = this.def(c), v = this.m.read(d.bind), off = v === null;
        r.node.classList.toggle("off", off);
        r.node.title = off ? `${d.label} — ${this.o.skins[d.bind.piece].name} absent(e) du Synoptique` : d.label;
        if (r.fill) {
          const f = off ? 0 : this.frac(d, v), base = d.center !== undefined ? this.frac(d, d.center) : 0;
          this.setBar(r.fill, c, off ? base : base, off ? base : f);
          const dec = d.decimals !== undefined ? d.decimals : (d.step && d.step < 1 ? 1 : 0);
          r.val.textContent = off ? "—" : (d.format ? d.format(v) : `${v.toFixed(dec)} ${d.unit || ""}`);
          if (r.knob) { if (c.orient === "v") { r.knob.style.left = "50%"; r.knob.style.top = ((1 - f) * 100) + "%"; } else { r.knob.style.top = "50%"; r.knob.style.left = (f * 100) + "%"; } }
        }
        if (r.sw) {
          const auto = this.m.isAuto(d.bind);
          r.sw.classList.toggle("on", !off && !!v); r.sw.classList.toggle("auto", auto);
          r.swTxt.textContent = off ? "—" : auto ? "auto" : (v ? (d.onText || "marche") : (d.offText || "arrêt"));
        }
        if (r.lamp) r.lamp.classList.toggle("on", !off && !!v);
      }
    }

    flip(c) {
      const d = this.def(c);
      if (this.m.read(d.bind) === null) return;
      if (this.m.isAuto(d.bind)) { this.o.toast("Cette commande est maintenant pilotée par un fil du Synoptique : l'interrupteur est en automatique."); return; }
      this.m.write(d.bind, this.m.read(d.bind) ? 0 : 1);
      this.o.log("panel_toggle", `${c.inst}=${this.m.read(d.bind)}`);
      this.update();
    }
    startSlide(e, c, track) {
      e.preventDefault(); e.stopPropagation();
      const d = this.def(c);
      if (this.m.read(d.bind) === null) return;
      const set = ev => {
        const r = track.getBoundingClientRect();
        let t = c.orient === "h" ? (ev.clientX - r.left) / r.width : 1 - (ev.clientY - r.top) / r.height;
        t = Math.max(0, Math.min(1, t));
        let v = d.range[0] + t * (d.range[1] - d.range[0]);
        if (d.step) v = Math.round(v / d.step) * d.step;
        this.m.write(d.bind, +v.toFixed(3)); this.update();
      };
      set(e);
      const up = () => { window.removeEventListener("pointermove", set); this.o.log("panel_set", `${c.inst}=${this.m.read(d.bind)}`); };
      window.addEventListener("pointermove", set);
      window.addEventListener("pointerup", up, { once: true });
    }
    startMove(e, c, node) {
      e.preventDefault();
      const r = this.grid.getBoundingClientRect();
      const ox = e.clientX - r.left - c.x * U, oy = e.clientY - r.top - c.y * U;
      let cand = null;
      node.classList.add("dragging");
      const move = ev => {
        const x = Math.round((ev.clientX - r.left - ox) / U), y = Math.round((ev.clientY - r.top - oy) / U);
        cand = { x, y };
        this.place(node, c, Math.max(0, x), Math.max(0, y));
        node.classList.toggle("bad", !this.fits(c, x, y, foot(c)));
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        if (cand && (cand.x !== c.x || cand.y !== c.y)) {
          if (this.fits(c, cand.x, cand.y, foot(c))) { c.x = cand.x; c.y = cand.y; this.o.log("panel_move", `${c.inst}@${c.x},${c.y}`); }
          else this.o.toast("Pas de place ici : les instruments ne se chevauchent pas.");
        }
        this.render();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up, { once: true });
    }
    startResize(e, c, node) {
      e.preventDefault(); e.stopPropagation();
      const r = this.grid.getBoundingClientRect();
      const move = ev => {
        const along = c.orient === "h" ? (ev.clientX - r.left) / U - c.x : (ev.clientY - r.top) / U - c.y;
        const len = Math.max(LEN_MIN, Math.min(LEN_MAX, Math.round(along)));
        if (len !== c.len && this.fits(c, c.x, c.y, foot(Object.assign({}, c, { len })))) { c.len = len; this.place(node, c, c.x, c.y); }
      };
      const up = () => { window.removeEventListener("pointermove", move); this.o.log("panel_resize", `${c.inst}:${c.len}`); this.render(); };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up, { once: true });
    }

    serialize() { return this.controls.map(c => ({ inst: c.inst, type: c.type, x: c.x, y: c.y, orient: c.orient, len: c.len })); }
  }

  K.Panel = Panel;
  K.PANEL_UNIT = U;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* ../lib/chart.js */
/* TSCG Kit — chart.js
 * Curves read from the Model history (one point per simulation step).
 * Configured by the workshop (W.chart):
 *   range:[lo,hi], tickY, span, tick, label(t)   axes, in the workshop's time unit
 *   band:[a,b], showBand(app)                    optional target zone
 *   series:[{piece, label, color}]               default: every storage
 *   strips:[{label, color, on(snap, model), shade}]  on/off bars under the curves,
 *                                                    or full-height shading (shade:true)
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  class Chart {
    constructor(canvas, model, o) { this.c = canvas; this.m = model; this.o = o; }
    draw() {
      const cv = this.c, m = this.m, o = this.o;
      const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return;
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
      const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
      const col = x => (x || "").startsWith("--") ? v(x) : x;
      const [lo, hi] = o.range || [0, 32], tickY = o.tickY || 10;
      const strips = (o.strips || []).filter(s => !s.shade), shades = (o.strips || []).filter(s => s.shade);
      const L = 34, R = 8, T = 6, B = 22 + 7 * strips.length, pw = w - L - R, ph = h - T - B;
      const span = o.span || 8, t1 = Math.max(span, m.t), t0 = t1 - span;
      const X = t => L + (t - t0) / span * pw, Y = val => T + (1 - (clampV(val) - lo) / (hi - lo)) * ph;
      function clampV(val) { return Math.max(lo, Math.min(hi, val)); }
      const hist = m.history.filter(s => s.t >= t0);
      const bw = Math.max(1, pw / Math.max(1, span / (this.o.app ? this.o.app.clock.dt : 1)));
      for (const s of shades) {                    // full-height shading (e.g. night)
        c.fillStyle = col(s.color); c.globalAlpha = .14;
        for (const p of hist) if (s.on(p, m)) c.fillRect(X(p.t) - bw, T, bw + 0.5, ph);
        c.globalAlpha = 1;
      }
      c.font = "11px system-ui, sans-serif"; c.lineWidth = 1;
      for (let y = Math.ceil(lo / tickY) * tickY; y <= hi; y += tickY) {
        c.strokeStyle = v("--grid"); c.beginPath(); c.moveTo(L, Y(y)); c.lineTo(w - R, Y(y)); c.stroke();
        c.fillStyle = v("--quiet"); c.fillText(String(y), 2, Y(y) + 4);
      }
      const tick = o.tick || 2, label = o.label || (t => t + " h");
      for (let t = Math.ceil(t0 / tick - 1e-9) * tick; t <= t1 + 1e-9; t += tick) { c.fillStyle = v("--quiet"); c.fillText(label(+t.toFixed(6)), X(t) - 8, h - 2); }
      if (o.band && (!o.showBand || o.showBand(o.app))) { c.fillStyle = v("--band"); c.fillRect(L, Y(o.band[1]), pw, Y(o.band[0]) - Y(o.band[1])); }
      const legend = [];
      const series = o.series
        ? o.series.map(s => ({ node: m.first(s.piece), label: s.label, color: col(s.color) })).filter(s => s.node)
        : m.nodes.filter(n => m.kindOf(n) === "storage").map(n => ({ node: n, label: m.skins[n.type].name, color: m.skins[n.type].color || v("--flux") }));
      for (const s of series) {
        const id = s.node.id;
        c.strokeStyle = s.color; c.lineWidth = 2; c.beginPath(); let on = false;
        for (const p of hist) {
          const val = p.v[id];
          if (val === null || val === undefined) { on = false; continue; }
          const x = X(p.t), y = Y(val);
          if (!on) { c.moveTo(x, y); on = true; } else c.lineTo(x, y);
        }
        c.stroke();
        legend.push(`<span style="color:${s.color}">■</span> ${s.label || m.skins[s.node.type].name}`);
      }
      strips.forEach((s, i) => {
        const y = h - B + 4 + 7 * i;
        c.fillStyle = col(s.color); c.globalAlpha = .6;
        let any = false;
        for (const p of hist) if (s.on(p, m)) { any = true; c.fillRect(X(p.t) - bw, y, bw + 0.5, 4); }
        c.globalAlpha = 1;
        if (any || m.history.some(p => s.on(p, m))) legend.push(`<span style="color:${col(s.color)};opacity:.7">▬</span> ${s.label}`);
      });
      for (const s of shades) if (m.history.some(p => s.on(p, m))) legend.push(`<span style="color:${col(s.color)};opacity:.5">█</span> ${s.label}`);
      if (o.legendEl) o.legendEl.innerHTML = legend.join(" &nbsp; ");
    }
  }
  K.Chart = Chart;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* ../lib/tutorial.js */
/* TSCG Kit — tutorial.js
 * Runs a workshop's steps as data. Each step:
 *   { id, title, goal, hint?, unlock:{pieces, instruments}, enter?(app),
 *     need(app) -> null | {msg, tab},           structure still missing
 *     check(app, mem) -> {p, done, status},     called once per simulated minute
 *     predict?:{q, choices}, takeaway, hood }
 * The final card may ask optional open questions (answers go into the export);
 * by default it asks nothing and leaves the discovery to the user.
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  // check helpers; durations are counted in simulation steps
  K.elapse = steps => (app, mem) => {
    mem.n = (mem.n || 0) + 1;
    return { p: mem.n / steps, done: mem.n >= steps, status: `En cours… ${app.fmtSteps(mem.n)} / ${app.fmtSteps(steps)}` };
  };
  K.hold = (steps, pred, offMsg) => (app, mem) => {
    const ok = pred(app); mem.n = ok ? (mem.n || 0) + 1 : 0;
    return { p: mem.n / steps, done: mem.n >= steps, status: ok ? `En cours… ${app.fmtSteps(mem.n)} / ${app.fmtSteps(steps)}` : offMsg };
  };
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  class Tutorial {
    // W: workshop (steps, final, free); app: { S, model, log, unlock(u), goTab(tab), goFree(), running() }
    constructor(host, W, app) {
      this.host = host; this.W = W; this.steps = W.steps; this.app = app;
      this.mode = "steps"; this.i = 0; this.mem = {}; this.res = null; this.finished = false;
    }
    start(i) {
      this.mode = "steps"; this.i = i; this.mem = {}; this.res = null; this.finished = false;
      const st = this.steps[i];
      this.app.unlock(st.unlock || {});
      if (st.enter) st.enter(this.app);
      this.app.log("step_enter", st.id);
      this.render();
    }
    restartCurrent() {
      if (this.mode !== "steps") return;
      this.mem = {}; this.res = null; this.finished = false;
      const st = this.steps[this.i]; if (st.enter) st.enter(this.app);
      this.render();
    }
    need() {
      if (this.mode !== "steps" || this.finished) return null;
      return this.steps[this.i].need(this.app);
    }
    waitingPrediction() { const st = this.steps[this.i]; return this.mode === "steps" && st.predict && this.app.S.predictions[st.id] === undefined; }
    tick() {
      if (this.mode !== "steps" || this.finished) return;
      if (this.need()) { this.mem = {}; this.res = null; return; }
      if (this.waitingPrediction()) return;
      this.res = this.steps[this.i].check(this.app, this.mem);
      if (this.res.done) { this.finished = true; this.app.log("step_done", this.steps[this.i].id); this.render(); }
    }

    render() {
      const S = this.app.S, h = this.host;
      if (this.mode === "free") {
        h.innerHTML = `<div class="tu-head"><h3>Atelier libre</h3></div><div class="tu-goal">${this.W.free.text}</div>` +
          (S.hood && this.W.free.hood ? `<div class="tu-hood">${this.W.free.hood}</div>` : "") +
          `<div class="tu-row"><button class="tu-back">Reprendre le tutoriel</button></div>`;
        h.querySelector(".tu-back").onclick = () => this.app.backToTutorial();
        return;
      }
      if (this.mode === "final") return this.renderFinal();
      const st = this.steps[this.i], n = this.steps.length;
      let html = `<div class="tu-head"><span class="tu-no">Étape ${this.i + 1} / ${n}</span><h3>${st.title}</h3></div><div class="tu-goal">${st.goal}</div>`;
      if (st.predict) {
        const pk = S.predictions[st.id];
        if (pk === undefined) html += `<div class="tu-q">${st.predict.q}</div><div class="tu-choices">` +
          st.predict.choices.map((c, k) => `<button data-choice="${k}">${c}</button>`).join("") + `</div>`;
        else html += `<div class="tu-hint">Ton pari : « ${st.predict.choices[pk]} ».</div>`;
      }
      if (st.hint && !this.finished) html += `<div class="tu-hint">${st.hint}</div>`;
      html += `<div class="tu-progress"><div></div></div><div class="tu-status-row"><span class="tu-status"></span><button class="tu-goto" hidden></button></div>`;
      if (this.finished) {
        html += `<div class="tu-takeaway">${st.takeaway}</div>`;
        if (S.hood && st.hood) html += `<div class="tu-hood">${st.hood}</div>`;
        html += `<div class="tu-row"><button class="primary tu-next">${this.i + 1 < n ? "Étape suivante" : "Terminer"}</button></div>`;
      }
      h.innerHTML = html;
      h.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => {
        S.predictions[st.id] = +b.dataset.choice; this.app.log("predict", `${st.id}: ${st.predict.choices[+b.dataset.choice]}`); this.render();
      });
      const nx = h.querySelector(".tu-next");
      if (nx) nx.onclick = () => { if (this.i + 1 < n) this.start(this.i + 1); else { this.mode = "final"; this.app.S.done = true; this.app.log("tutorial_done", ""); this.app.unlock(this.W.final.unlock || {}); this.render(); } };
      this.refresh();
    }
    renderFinal() {
      const S = this.app.S, F = this.W.final, h = this.host;
      let html = `<div class="tu-head"><h3>${F.title}</h3></div><div class="tu-goal">${F.text}</div>`;
      if (!F.questions || !F.questions.length) {          // default: no questions, let the user discover
        html += (S.hood && F.hood ? `<div class="tu-hood">${F.hood}</div>` : "") +
          `<div class="tu-row"><button class="primary tu-free">Ouvrir l'atelier libre</button></div>`;
      } else if (!S.answers) {
        html += F.questions.map((q, k) => `<label class="tu-ask">${q}<textarea data-q="${k}" rows="2" placeholder="Ta réponse, en quelques mots…"></textarea></label>`).join("") +
          `<div class="tu-row"><button class="primary tu-save">Enregistrer mes réponses</button><button class="tu-skip">Passer</button></div>`;
      } else {
        html += `<div class="tu-takeaway">Merci ! Tes réponses seront dans le fichier « Exporter ma session ».</div>` +
          (S.hood && F.hood ? `<div class="tu-hood">${F.hood}</div>` : "") +
          `<div class="tu-row"><button class="primary tu-free">Ouvrir l'atelier libre</button></div>`;
      }
      h.innerHTML = html;
      const save = h.querySelector(".tu-save");
      if (save) save.onclick = () => {
        S.answers = F.questions.map((q, k) => ({ q, a: h.querySelector(`[data-q="${k}"]`).value.trim() }));
        this.app.log("answers", S.answers.map(x => esc(x.a)).join(" | ")); this.render();
      };
      const skip = h.querySelector(".tu-skip");
      if (skip) skip.onclick = () => { S.answers = []; this.app.log("answers_skipped", ""); this.render(); };
      const fr = h.querySelector(".tu-free"); if (fr) fr.onclick = () => this.app.goFree();
    }

    // light per-frame refresh: progress bar, status line, "go to tab" hint
    refresh() {
      const bar = this.host.querySelector(".tu-progress>div"), status = this.host.querySelector(".tu-status"), go = this.host.querySelector(".tu-goto");
      const nd = this.need();
      this.app.attention(nd && nd.tab ? nd.tab : null);
      if (!bar || !status) return;
      if (this.finished) { bar.style.width = "100%"; status.textContent = "Étape réussie."; go.hidden = true; return; }
      bar.style.width = Math.min(100, Math.round(100 * ((this.res && this.res.p) || 0))) + "%";
      if (nd) status.textContent = nd.msg;
      else if (this.waitingPrediction()) status.textContent = "Réponds d'abord à la question ci-dessus.";
      else if (!this.app.running()) status.textContent = "Lance le temps avec ▶ (en haut).";
      else status.textContent = this.res ? this.res.status : "En cours…";
      const want = nd && nd.tab && nd.tab !== this.app.S.tab ? nd.tab : null;
      go.hidden = !want;
      if (want) { go.textContent = want === "panel" ? "Aller au Panneau →" : "Aller au Synoptique →"; go.onclick = () => this.app.goTab(want); }
    }
  }
  K.Tutorial = Tutorial;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* ../lib/app.js */
/* TSCG Kit — app.js
 * The workshop shell, identical for every workshop:
 *   left  : tutorial banner + tabs [Panneau | Synoptique]
 *   right : Maquette (drawn by the workshop) + Courbes
 * Owns the clock, the main loop, "under the hood", free mode and the session export.
 * Usage: TSCGKit.start(workshopDefinition)
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  const VERSION = "0.3.0";
  const SPEEDS = [1, 4, 0.5];

  K.start = function (W) {
    // the workshop's clock: model time per step, steps per real second at ×1, formatting
    const CLK = Object.assign({}, K.CLOCK_HOURS, W.clock || {});
    document.title = W.pageTitle || document.title;
    document.body.innerHTML =
      `<header class="k-header">
         <a class="k-home" href="${W.homeUrl || "../index.html"}" title="Tous les ateliers">←</a>
         <h1>${W.title}</h1>
         <div class="k-transport">
           <button id="kPlay" class="primary" title="Lancer / mettre en pause (barre d'espace)">▶ Lancer</button>
           <button id="kSpeed" title="Vitesse du temps">×1</button>
           <button id="kReset" title="Remettre l'horloge à zéro">↺</button>
           <span id="kClock" class="k-clock"></span>
         </div>
         <span class="k-spacer"></span>
         <button id="kHood" title="Montrer les noms génériques des pièces">Sous le capot</button>
         <button id="kFree" title="Débloquer toutes les pièces et quitter le tutoriel">Mode libre</button>
         <button id="kExport" title="Télécharger le journal de la session (pour les tests)">Exporter ma session</button>
       </header>
       <main class="k-main">
         <section class="k-left">
           <div class="k-banner" id="kBanner" aria-live="polite"></div>
           <div class="k-tabs" role="tablist">
             <button class="k-tab" role="tab" data-tab="panel">Panneau</button>
             <button class="k-tab" role="tab" data-tab="synoptic">Synoptique</button>
           </div>
           <div class="k-panes">
             <div class="k-pane k-pane-panel" data-pane="panel"></div>
             <div class="k-pane k-pane-synoptic" data-pane="synoptic"></div>
           </div>
         </section>
         <section class="k-right">
           <div class="k-maquette"><h2 class="k-h2">Maquette</h2><div class="k-view" id="kView"></div></div>
           <div class="k-curves"><h2 class="k-h2">Courbes</h2><canvas id="kChart"></canvas><div class="k-legend" id="kLegend"></div></div>
         </section>
       </main>
       <div class="k-toast" id="kToast" role="status"></div>`;
    const $ = sel => document.querySelector(sel);

    const S = { running: false, speed: 1, hood: false, free: false, tab: "synoptic",
                pieces: new Set(), instruments: new Set(), log: [], t0: Date.now(),
                predictions: {}, answers: null, done: false };
    const model = new K.Model(W.skins);
    const log = (type, detail) => S.log.push({ t: +((Date.now() - S.t0) / 1000).toFixed(1), sim: +model.t.toFixed(3), type, detail: detail === undefined ? "" : detail });
    model.on(log);
    let toastTimer = null;
    const toast = msg => { const t = $("#kToast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800); };

    const app = { S, model, log, toast, W, clock: CLK, fmtSteps: CLK.fmtSteps };
    const changed = () => { app.panel.renderToolbar(); app.panel.update(); app.tutorial.refresh(); };
    app.synoptic = new K.Synoptic($('[data-pane="synoptic"]'), model, {
      order: W.order, home: W.home, fluxLabel: W.fluxLabel,
      isUnlocked: t => S.free || S.pieces.has(t), hood: () => S.hood, toast, onChange: changed });
    app.panel = new K.Panel($('[data-pane="panel"]'), model, {
      instruments: W.instruments, skins: W.skins,
      isUnlocked: k => (S.free || S.instruments.has(k)), toast, log, onChange: () => app.tutorial.refresh() });
    app.view = W.view($("#kView"), model, { log, toast, hood: () => S.hood, running: () => S.running });
    app.chart = new K.Chart($("#kChart"), model, Object.assign({}, W.chart, { legendEl: $("#kLegend"), app }));

    app.running = () => S.running;
    app.unlock = u => {
      (u.pieces || []).forEach(p => S.pieces.add(p));
      (u.instruments || []).forEach(i => S.instruments.add(i));
      app.synoptic.renderPalette(); app.panel.renderToolbar();
    };
    app.attention = tab => document.querySelectorAll(".k-tab").forEach(b => b.classList.toggle("attn", b.dataset.tab === tab && tab !== S.tab));
    app.goTab = tab => {
      S.tab = tab;
      document.querySelectorAll(".k-tab").forEach(b => { b.classList.toggle("active", b.dataset.tab === tab); b.setAttribute("aria-selected", b.dataset.tab === tab); });
      document.querySelectorAll(".k-pane").forEach(p => p.classList.toggle("active", p.dataset.pane === tab));
      if (tab === "synoptic") app.synoptic.render(); else app.panel.render();
      log("tab", tab); app.tutorial.refresh();
    };
    app.goFree = () => {
      S.free = true; $("#kFree").classList.add("on");
      app.tutorial.mode = "free"; log("mode_free", "");
      app.synoptic.renderPalette(); app.panel.renderToolbar(); app.tutorial.render();
    };
    app.backToTutorial = () => {
      S.free = false; $("#kFree").classList.remove("on"); log("mode_tutorial", "");
      app.synoptic.renderPalette(); app.panel.renderToolbar();
      app.tutorial.start(S.done ? 0 : app.tutorial.i);
    };
    app.tutorial = new K.Tutorial($("#kBanner"), W, app);

    // ---- header controls
    const setPlay = on => { S.running = on; $("#kPlay").textContent = on ? "⏸ Pause" : "▶ Lancer"; log(on ? "play" : "pause", ""); app.tutorial.refresh(); };
    $("#kPlay").onclick = () => setPlay(!S.running);
    $("#kSpeed").onclick = e => { S.speed = SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]; e.target.textContent = "×" + S.speed; log("speed", S.speed); };
    $("#kReset").onclick = () => { model.resetAll(); app.tutorial.restartCurrent(); log("reset", ""); app.synoptic.render(); };
    $("#kHood").onclick = e => {
      S.hood = !S.hood; e.target.classList.toggle("on", S.hood); log("hood", S.hood);
      app.synoptic.renderPalette(); app.synoptic.render(); app.synoptic.renderParams(); app.tutorial.render();
    };
    $("#kFree").onclick = () => { if (!S.free) app.goFree(); };
    $("#kExport").onclick = () => {
      const t = app.tutorial;
      const data = { tool: "TSCG Kit", workshop: W.id, version: VERSION, exported: new Date().toISOString(),
        progress: S.free ? "free" : t.mode === "final" ? "done" : t.steps[t.i].id,
        predictions: Object.fromEntries(Object.entries(S.predictions).map(([id, k]) => [id, W.steps.find(s => s.id === id).predict.choices[k]])),
        answers: S.answers,
        state: { graph: model.serialize(), panel: app.panel.serialize() },
        log: S.log };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `tscg-${W.id}-session-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      log("export", "");
    };
    document.querySelectorAll(".k-tab").forEach(b => b.onclick = () => app.goTab(b.dataset.tab));
    window.addEventListener("keydown", e => {
      const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if ((e.key === "Delete" || e.key === "Backspace") && !typing && S.tab === "synoptic") { e.preventDefault(); app.synoptic.deleteSelected(); }
      if (e.key === " " && !typing && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); setPlay(!S.running); }
    });

    // ---- main loop: accumulate real time, run whole simulation steps
    let last = performance.now(), acc = 0, chartT = 0;
    function frame(now) {
      const dt = Math.min(0.25, (now - last) / 1000); last = now;
      if (S.running) {
        acc += dt * CLK.stepsPerSec * S.speed;
        let guard = 0;
        while (acc >= 1 && guard++ < 600) { model.step(CLK.dt); app.tutorial.tick(); acc -= 1; }
      }
      app.synoptic.update(S.running); app.panel.update(); app.view.update(S.running); app.tutorial.refresh();
      $("#kClock").textContent = CLK.fmt(model.t);
      if (now - chartT > 120) { app.chart.draw(); chartT = now; }
      requestAnimationFrame(frame);
    }

    app.step = n => { for (let i = 0; i < n; i++) { model.step(CLK.dt); app.tutorial.tick(); } };   // for tests
    app.synoptic.renderParams();
    app.goTab("synoptic");
    app.tutorial.start(0);
    requestAnimationFrame(frame);
    window.TSCG = app;            // handle for tests and for curious KitArchitects
    return app;
  };
  K.VERSION = VERSION;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* workshop.js */
/* TSCG Kit — Larsen workshop definition
 * A room, a voice, an amplifier and a loudspeaker. Sound levels are an envelope
 * model (no waveform): the room absorbs, the loudspeaker re-injects what the
 * microphone picks up. Above a loop gain of 1 the loop feeds itself: Larsen.
 * Time unit: seconds, one step = 10 ms, shown in slow motion.
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  const syn = msg => ({ msg, tab: "synoptic" });
  const pan = msg => ({ msg, tab: "panel" });
  const lvl = app => { const r = app.model.first("salle"); return r ? r.s.x : 0; };
  const speaking = app => { const v = app.model.first("voix"); return !!(v && v.s.u); };
  const saturated = app => { const a = app.model.first("ampli"); return !!(a && a.s.sat); };
  const loopWired = m => m.linked("salle", "level", "ampli", "x") && m.linked("ampli", "y", "hp", "x") && m.linked("hp", "flow", "salle", "in");

  const W = {
    id: "larsen",
    title: "Atelier TSCG — Larsen",
    pageTitle: "TSCG Atelier — Larsen",
    fluxLabel: "flux (son)",
    clock: { dt: 0.01, stepsPerSec: 25, fmt: t => t.toFixed(1) + " s", fmtSteps: n => (n * 0.01).toFixed(1) + " s" },
    order: ["salle", "voix", "ampli", "hp"],
    home: { voix: { x: 16, y: 24 }, salle: { x: 236, y: 24 }, ampli: { x: 456, y: 220 }, hp: { x: 16, y: 220 } },

    skins: {
      salle: { kind: "storage", name: "Salle", blurb: "le son s'y accumule puis s'éteint",
        ports: { in: "son reçu", out: "fuite", level: "capté par le micro" },
        describe: n => "niveau " + n.s.x.toFixed(0),
        params: { decay: { label: "Absorption (/s)", v: 10, step: 1, min: 1, max: 40 },
                  C: { v: 1, hidden: true }, k: { v: 0, hidden: true }, x0: { v: 0, hidden: true },
                  base: { label: "Bruit ambiant", v: 0.5, step: 0.5, min: 0, max: 20 }, lo: { v: 0, hidden: true } } },
      voix: { kind: "source", name: "Voix", blurb: "quelqu'un parle", onText: "parle", offText: "se tait",
        ports: { cmd: "commande", flow: "son" },
        params: { P: { label: "Force de la voix", v: 100, step: 10, min: 0, max: 300 } } },
      ampli: { kind: "amplify", name: "Ampli", blurb: "multiplie le signal du micro",
        ports: { x: "signal du micro", y: "signal amplifié" },
        describe: n => (n.s.sat ? "saturé" : "gain ×" + n.p.gain.toFixed(2)),
        params: { gain: { label: "Volume (gain)", v: 0.3, step: 0.05, min: 0, max: 2.5 },
                  max: { label: "Plafond de sortie", v: 90, step: 5, min: 10, max: 200 } } },
      hp: { kind: "transducer", name: "Haut-parleur", blurb: "change le signal en son",
        ports: { x: "signal", flow: "son" },
        describe: n => (n.s.att < 1 ? "micro éloigné · " : "") + "son " + n.s.flow.toFixed(0),
        params: { k: { label: "Rendement", v: 10, step: 1, min: 0, max: 30 }, max: { v: 5000, hidden: true }, noise: { v: 0, hidden: true } } }
    },

    instruments: {
      vumetre: { type: "gauge", label: "Vu-mètre de la salle", short: "Niveau", bind: { piece: "salle", get: "level" }, range: [0, 100], decimals: 0, unit: "", zone: [18, 30] },
      parler:  { type: "toggle", label: "Bouton de la voix", short: "Voix", bind: { piece: "voix", set: "manual" }, onText: "parle", offText: "silence" },
      volume:  { type: "slider", label: "Volume de l'ampli", short: "Volume", bind: { piece: "ampli", param: "gain" }, range: [0, 2.5], step: 0.05, decimals: 2, unit: "×" },
      sature:  { type: "lamp", label: "Témoin de saturation de l'ampli", short: "Saturation", bind: { piece: "ampli", get: "sat" } }
    },

    chart: {
      range: [0, 100], tickY: 25, span: 4, tick: 1, label: t => t + " s",
      series: [{ piece: "salle", label: "Niveau dans la salle", color: "--flux" }],
      strips: [
        { label: "voix", color: "--info", on: (p, m) => { const v = m.first("voix"); return !!(v && p.u[v.id]); } },
        { label: "ampli saturé", color: "--bad", on: (p, m) => { const a = m.first("ampli"); return !!(a && p.u[a.id]); } }
      ]
    },

    steps: [
      { id: "talk", title: "Parler dans la salle",
        unlock: { pieces: ["salle", "voix"], instruments: ["vumetre", "parler"] },
        goal: "Dans le <b>Synoptique</b>, pose une <b>Salle</b> et une <b>Voix</b>, et relie le <i>son</i> de la Voix à la Salle. Dans le <b>Panneau</b>, ajoute le <b>vu-mètre</b> et le <b>bouton de la voix</b>. Lance le temps, parle un instant, puis tais-toi.",
        need: app => { const m = app.model;
          return !m.first("salle") || !m.first("voix") ? syn("Pose une Salle et une Voix dans le Synoptique.") :
                 !m.linked("voix", "flow", "salle", "in") ? syn("Relie le son de la Voix à la Salle.") :
                 !app.panel.has("vumetre") ? pan("Ajoute le vu-mètre dans le Panneau.") :
                 !app.panel.has("parler") ? pan("Ajoute le bouton de la voix dans le Panneau.") : null; },
        check: (app, mem) => {
          if (speaking(app)) mem.spoke = (mem.spoke || 0) + 1;
          const s = mem.spoke || 0;
          if (s < 30) return { p: 0.5 * s / 30, done: false, status: s ? "Continue de parler un instant…" : "Clique sur le bouton de la voix pour parler." };
          if (speaking(app)) return { p: 0.5, done: false, status: "Maintenant, tais-toi (clique à nouveau sur le bouton)." };
          return { p: lvl(app) < 1 ? 1 : 0.75, done: lvl(app) < 1, status: "Écoute le niveau retomber…" };
        },
        takeaway: "Quand tu parles, le niveau monte puis se stabilise. Quand tu te tais, il retombe tout seul : la salle absorbe le son. Le silence est l'état vers lequel elle revient toujours.",
        hood: "Salle = <b>Storage</b> qui se vide d'elle-même (absorption). Voix = <b>Source</b>." },

      { id: "amplify", title: "Sonoriser",
        unlock: { pieces: ["ampli", "hp"], instruments: ["volume"] },
        goal: "Pose un <b>Ampli</b> et un <b>Haut-parleur</b>. Relie ce que la Salle <i>capte par le micro</i> à l'Ampli, l'Ampli au Haut-parleur, et le <i>son</i> du Haut-parleur à la Salle. Ajoute le <b>curseur de volume</b>. Puis, en parlant, amène le vu-mètre dans la zone verte et tiens une seconde.",
        hint: "Monte le volume doucement.",
        need: app => { const m = app.model;
          return !m.first("ampli") || !m.first("hp") ? syn("Pose un Ampli et un Haut-parleur.") :
                 !m.linked("salle", "level", "ampli", "x") ? syn("Relie ce que capte le micro (Salle) à l'Ampli.") :
                 !m.linked("ampli", "y", "hp", "x") ? syn("Relie l'Ampli au Haut-parleur.") :
                 !m.linked("hp", "flow", "salle", "in") ? syn("Relie le son du Haut-parleur à la Salle.") :
                 !app.panel.has("volume") ? pan("Ajoute le curseur de volume dans le Panneau.") : null; },
        check: (app, mem) => {
          const ok = speaking(app) && lvl(app) >= 18 && lvl(app) <= 30 && !saturated(app);
          mem.n = ok ? (mem.n || 0) + 1 : 0;
          return { p: mem.n / 100, done: mem.n >= 100,
            status: !speaking(app) ? "Parle (bouton de la voix) pour remplir la salle." : ok ? `Tiens bon… ${app.fmtSteps(mem.n)} / 1.0 s` :
                    lvl(app) < 18 ? "Pas assez fort : monte un peu le volume." : "Trop fort : baisse un peu le volume." };
        },
        takeaway: "Ta voix porte plus loin : le haut-parleur renvoie dans la salle ce que le micro capte, qui est capté à nouveau, renvoyé… La sortie revient renforcer l'entrée. Pour l'instant, chaque tour rend moins qu'il ne reçoit, et tout reste calme.",
        hood: "Ampli = <b>Amplification</b>. Haut-parleur = <b>Transducer</b> (signal → son). Le chemin Salle → Ampli → Haut-parleur → Salle forme une <b>Feedback Loop</b> positive." },

      { id: "whistle", title: "Le sifflement",
        unlock: { instruments: ["sature"] },
        predict: { q: "Avant d'essayer : si tu montes encore le volume, puis que tu te tais, que va-t-il se passer ?",
                   choices: ["Le son retombe, comme avant", "Le son reste un peu plus fort", "Ça siffle, et ça ne s'arrête plus"] },
        goal: "Ajoute le <b>témoin de saturation</b>. Monte le volume petit à petit, puis tais-toi. Observe le vu-mètre, la Maquette… et écoute.",
        hint: "Le son de la Maquette se coupe avec le petit haut-parleur en haut à droite.",
        need: app => !loopWired(app.model) ? syn("Garde la boucle Salle → Ampli → Haut-parleur → Salle.") :
                     !app.panel.has("sature") ? pan("Ajoute le témoin de saturation dans le Panneau.") : null,
        check: (app, mem) => {
          const ok = !speaking(app) && saturated(app);
          mem.n = ok ? (mem.n || 0) + 1 : 0;
          return { p: mem.n / 100, done: mem.n >= 100,
            status: speaking(app) ? "Tais-toi, pour voir ce que fait la boucle toute seule." : ok ? `Ça tient tout seul… ${app.fmtSteps(mem.n)} / 1.0 s` : "Monte encore le volume, doucement." };
        },
        takeaway: "Au-delà d'un certain volume, la boucle s'entretient d'elle-même : plus besoin de parler, le moindre bruit suffit à la lancer. Seul le plafond de l'ampli l'arrête. C'est l'effet Larsen.",
        hood: "Le seuil, c'est quand un tour de boucle rend autant qu'il reçoit (gain de boucle = 1). Il n'y a pas de pièce « seuil » : il naît du câblage." },

      { id: "distance", title: "Éloigner le micro",

  <g id="lxMic" class="mq-click">
    <rect id="lxMicHit" x="0" y="0" width="40" height="150" fill="transparent"/>
    <line x1="20" y1="40" x2="20" y2="148" stroke="#b9b6ad" stroke-width="3"/>

    <rect x="352" y="96" width="56" height="96" rx="6" fill="#1d1c22" stroke="#77736a" stroke-width="2"/>
    <circle cx="380" cy="122" r="10" fill="#3a3942" stroke="#77736a"/>
    <circle id="lxCone" cx="380" cy="164" r="18" fill="#3a3942" stroke="#77736a" stroke-width="2"/>
    <line x1="380" y1="192" x2="380" y2="252" stroke="#77736a" stroke-width="4"/>

  <g id="lxMute" class="mq-click" transform="translate(396 24)">

      const $ = id => host.querySelector("#" + id);
      const NEAR = 250, FAR = 150;
      let micX = NEAR, muted = false, audio = null;
      const ease = { lvl: 0, cone: 0 };

      function ensureAudio() {
        if (audio || muted) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          const ctx = new AC(), osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = "sine"; osc.frequency.value = 2200; gain.gain.value = 0;
          osc.connect(gain).connect(ctx.destination); osc.start();
          audio = { ctx, osc, gain };
        } catch (e) { audio = null; }
      }
      document.addEventListener("pointerdown", ensureAudio);
      $("lxMute").addEventListener("click", () => { muted = !muted; api.log("mute", muted); if (!muted) ensureAudio(); });
      $("lxMic").addEventListener("click", () => {
        const hp = model.first("hp");
        if (!hp) { api.toast("Le micro ne compte que s'il y a un haut-parleur : pose-le dans le Synoptique."); return; }
        hp.s.att = hp.s.att < 1 ? 1 : 0.5;
        api.log("mic", hp.s.att < 1 ? "far" : "near");
      });

      return {
        update(running) {
          const salle = model.first("salle"), voix = model.first("voix"), hp = model.first("hp"), ampli = model.first("ampli");
          $("lxEmpty").style.display = salle ? "none" : "";
          const L = salle ? salle.s.x : 0;
          ease.lvl += (L - ease.lvl) * 0.2;
          const f = Math.max(0, Math.min(1, ease.lvl / 100)), sat = !!(ampli && ampli.s.sat);
          $("lxAir").setAttribute("fill", salle ? `rgb(${Math.round(58 + 120 * f * (sat ? 1 : .5))},${Math.round(56 + 20 * f)},${Math.round(70 + 10 * f)})` : "#3a3942");
          $("lxPerson").style.display = voix && salle ? "" : "none";
          $("lxSpeech").setAttribute("opacity", voix && voix.s.u ? 0.9 : 0);
          $("lxMic").style.display = salle ? "" : "none";
          const far = !!(hp && hp.s.att < 1);
          micX += ((far ? FAR : NEAR) - micX) * 0.15;
          $("lxMic").setAttribute("transform", `translate(${(micX - 20).toFixed(1)} 98)`);
          $("lxSpk").style.display = hp ? "" : "none";
          if (hp) {
            const out = Math.max(0, Math.min(1, (hp.s.flow || 0) / 900));
            ease.cone = running ? Math.sin(performance.now() / (sat ? 18 : 60)) * out : 0;
            $("lxCone").setAttribute("r", (18 + 2.5 * ease.cone).toFixed(2));
            host.querySelectorAll(".lxArc").forEach(a => {
              const i = +a.dataset.i, on = out > i / 6 + 0.01;
              a.setAttribute("stroke", sat ? "#ff8a3d" : "#cfd8e6");
              a.setAttribute("opacity", on ? (0.85 - i * 0.1).toFixed(2) : 0);
            });
          }
          $("lxMuteOn").style.display = muted ? "none" : ""; $("lxMuteOff").style.display = muted ? "" : "none";
          if (audio) {
            const loud = !muted && running && hp ? Math.max(0, Math.min(1, (L - 30) / 60)) : 0;
            audio.gain.gain.setTargetAtTime(0.05 * loud, audio.ctx.currentTime, 0.05);
            audio.osc.frequency.setTargetAtTime(far ? 2600 : 2100, audio.ctx.currentTime, 0.2);
          }
        }
      };
    }
  };
