<script>
/* ../lib/tutorial.js */
/* TSCG Kit — tutorial.js
 * Runs a workshop's steps as data. Each step:
 *   { id, title, goal, hint?, unlock:{pieces, instruments}, enter?(app),
 *     need(app) -> null | {msg, tab},           structure still missing
 *     check(app, mem) -> {p, done, status},     called once per simulated minute
 *     predict?:{q, choices}, takeaway, hood }
 * The final card may ask optional open questions (answers go into the export);
 * by default it asks nothing and leaves the discovery to the user.
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  // check helpers; durations are counted in simulation steps
  K.elapse = steps => (app, mem) => {
    mem.n = (mem.n || 0) + 1;
    return { p: mem.n / steps, done: mem.n >= steps, status: K.t("tu_runningof", app.fmtSteps(mem.n), app.fmtSteps(steps)) };
  };
  K.hold = (steps, pred, offMsg) => (app, mem) => {
    const ok = pred(app); mem.n = ok ? (mem.n || 0) + 1 : 0;
    return { p: mem.n / steps, done: mem.n >= steps, status: ok ? K.t("tu_runningof", app.fmtSteps(mem.n), app.fmtSteps(steps)) : offMsg };
  };
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  class Tutorial {
    // W: workshop (steps, final, free); app: { S, model, log, unlock(u), goTab(tab), goFree(), running() }
    constructor(host, W, app) {
      this.host = host; this.W = W; this.steps = W.steps; this.app = app;
      this.mode = "steps"; this.i = 0; this.mem = {}; this.res = null; this.finished = false;
    }
    start(i) {
      this.mode = "steps"; this.i = i; this.mem = {}; this.res = null; this.finished = false;
      const st = this.steps[i];
      this.app.unlock(st.unlock || {});
      if (st.enter) st.enter(this.app);
      this.app.log("step_enter", st.id);
      this.render();
    }
    restartCurrent() {
      if (this.mode !== "steps") return;
      this.mem = {}; this.res = null; this.finished = false;
      const st = this.steps[this.i]; if (st.enter) st.enter(this.app);
      this.render();
    }
    need() {
      if (this.mode !== "steps" || this.finished) return null;
      return this.steps[this.i].need(this.app);
    }
    waitingPrediction() { const st = this.steps[this.i]; return this.mode === "steps" && st.predict && this.app.S.predictions[st.id] === undefined; }
    tick() {
      if (this.mode !== "steps" || this.finished) return;
      if (this.need()) { this.mem = {}; this.res = null; return; }
      if (this.waitingPrediction()) return;
      this.res = this.steps[this.i].check(this.app, this.mem);
      if (this.res.done) { this.finished = true; this.app.log("step_done", this.steps[this.i].id); this.render(); }
    }

    render() {
      const S = this.app.S, h = this.host;
      if (this.mode === "free") {
        h.innerHTML = `<div class="tu-head"><h3>${K.t("tu_free")}</h3></div><div class="tu-goal">${this.W.free.text}</div>` +
          (S.hood && this.W.free.hood ? `<div class="tu-hood">${this.W.free.hood}</div>` : "") +
          `<div class="tu-row"><button class="tu-back">${K.t("tu_back")}</button></div>`;
        h.querySelector(".tu-back").onclick = () => this.app.backToTutorial();
        return;
      }
      if (this.mode === "final") return this.renderFinal();
      const st = this.steps[this.i], n = this.steps.length;
      let html = `<div class="tu-head"><span class="tu-no">${K.t("tu_step", this.i + 1, n)}</span><h3>${st.title}</h3></div><div class="tu-goal">${st.goal}</div>`;
      if (st.predict) {
        const pk = S.predictions[st.id];
        if (pk === undefined) html += `<div class="tu-q">${st.predict.q}</div><div class="tu-choices">` +
          st.predict.choices.map((c, k) => `<button data-choice="${k}">${c}</button>`).join("") + `</div>`;
        else html += `<div class="tu-hint">${K.t("tu_bet", st.predict.choices[pk])}</div>`;
      }
      if (st.hint && !this.finished) html += `<div class="tu-hint">${st.hint}</div>`;
      html += `<div class="tu-progress"><div></div></div><div class="tu-status-row"><span class="tu-status"></span><button class="tu-goto" hidden></button></div>`;
      if (this.finished) {
        html += `<div class="tu-takeaway">${st.takeaway}</div>`;
        if (S.hood && st.hood) html += `<div class="tu-hood">${st.hood}</div>`;
        html += `<div class="tu-row"><button class="primary tu-next">${this.i + 1 < n ? K.t("tu_next") : K.t("tu_finish")}</button></div>`;
      }
      h.innerHTML = html;
      h.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => {
        S.predictions[st.id] = +b.dataset.choice; this.app.log("predict", `${st.id}: ${st.predict.choices[+b.dataset.choice]}`); this.render();
      });
      const nx = h.querySelector(".tu-next");
      if (nx) nx.onclick = () => { if (this.i + 1 < n) this.start(this.i + 1); else { this.mode = "final"; this.app.S.done = true; this.app.log("tutorial_done", ""); this.app.unlock(this.W.final.unlock || {}); this.render(); } };
      this.refresh();
    }
    renderFinal() {
      const S = this.app.S, F = this.W.final, h = this.host;
      let html = `<div class="tu-head"><h3>${F.title}</h3></div><div class="tu-goal">${F.text}</div>`;
      if (!F.questions || !F.questions.length) {          // default: no questions, let the user discover
        html += (S.hood && F.hood ? `<div class="tu-hood">${F.hood}</div>` : "") +
          `<div class="tu-row"><button class="primary tu-free">${K.t("tu_openfree")}</button></div>`;
      } else if (!S.answers) {
        html += F.questions.map((q, k) => `<label class="tu-ask">${q}<textarea data-q="${k}" rows="2" placeholder="${K.t("tu_ph")}"></textarea></label>`).join("") +
          `<div class="tu-row"><button class="primary tu-save">${K.t("tu_save")}</button><button class="tu-skip">${K.t("tu_skip")}</button></div>`;
      } else {
        html += `<div class="tu-takeaway">${K.t("tu_thanks")}</div>` +
          (S.hood && F.hood ? `<div class="tu-hood">${F.hood}</div>` : "") +
          `<div class="tu-row"><button class="primary tu-free">${K.t("tu_openfree")}</button></div>`;
      }
      h.innerHTML = html;
      const save = h.querySelector(".tu-save");
      if (save) save.onclick = () => {
        S.answers = F.questions.map((q, k) => ({ q, a: h.querySelector(`[data-q="${k}"]`).value.trim() }));
        this.app.log("answers", S.answers.map(x => esc(x.a)).join(" | ")); this.render();
      };
      const skip = h.querySelector(".tu-skip");
      if (skip) skip.onclick = () => { S.answers = []; this.app.log("answers_skipped", ""); this.render(); };
      const fr = h.querySelector(".tu-free"); if (fr) fr.onclick = () => this.app.goFree();
    }

    // light per-frame refresh: progress bar, status line, "go to tab" hint
    refresh() {
      const bar = this.host.querySelector(".tu-progress>div"), status = this.host.querySelector(".tu-status"), go = this.host.querySelector(".tu-goto");
      const nd = this.need();
      this.app.attention(nd && nd.tab ? nd.tab : null);
      const st = this.mode === "steps" ? this.steps[this.i] : null;     // a step that asks to read the curves
      this.app.curvesHint(!!(st && st.curves && !this.finished));
      if (!bar || !status) return;
      if (this.finished) { bar.style.width = "100%"; status.textContent = K.t("tu_done"); go.hidden = true; return; }
      bar.style.width = Math.min(100, Math.round(100 * ((this.res && this.res.p) || 0))) + "%";
      if (nd) status.textContent = nd.msg;
      else if (this.waitingPrediction()) status.textContent = K.t("tu_answer");
      else if (!this.app.running()) status.textContent = K.t("tu_play");
      else status.textContent = this.res ? this.res.status : K.t("tu_running");
      const want = nd && nd.tab && nd.tab !== this.app.S.tab ? nd.tab : null;
      go.hidden = !want;
      if (want) { go.textContent = want === "panel" ? K.t("tu_gopanel") : K.t("tu_gosyn"); go.onclick = () => this.app.goTab(want); }
    }
  }
  K.Tutorial = Tutorial;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* ../lib/app.js */
/* TSCG Kit — app.js
 * The workshop shell, identical for every workshop:
 *   top row    : tutorial banner (left) | tabs [Scale model | Curves] (right)
 *   bottom row : tabs [Synoptic | Panel], full width
 * Owns the clock, the main loop, "under the hood", free mode, the language
 * switch and the session export.
 * Usage: TSCGKit.start(factory), where factory(L) returns the workshop definition
 * with every text written as L(english, french).
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  const VERSION = "0.9.3";
  const SPEEDS = [0.25, 0.5, 1, 2, 4, 8, 16];
  const LAYOUT_KEY = "tscg-kit-layout";
  const build = factory => factory((en, fr) => (K.lang === "fr" ? fr : en));

  K.start = function (factory) {
    let W = typeof factory === "function" ? build(factory) : factory;
    // the workshop's clock: model time per step, steps per real second at ×1, formatting
    const CLK = Object.assign({}, K.CLOCK_HOURS, W.clock || {});
    document.documentElement.lang = K.lang;
    document.body.innerHTML =
      `<header class="k-header">
         <a class="k-home" id="kHome" data-tip="home_tip"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 3.8 L21 11 M5.5 9.5 V20 H18.5 V9.5 M10 20 V14.5 H14 V20"/></svg></a>
         <h1 id="kTitle"></h1>
         <div class="k-transport">
           <button id="kPlay" class="primary" data-tip="play_tip"></button>
           <span class="k-gap" aria-hidden="true"></span>
           <button id="kSlow" class="k-ff" data-tip="speed_down"><svg class="k-icon" viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><path d="M8 1 L1 6 L8 11 Z M15 1 L8 6 L15 11 Z" fill="currentColor"/></svg></button>
           <span id="kSpeed" class="k-speed"></span>
           <button id="kFast" class="k-ff" data-tip="speed_up"><svg class="k-icon" viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><path d="M1 1 L8 6 L1 11 Z M8 1 L15 6 L8 11 Z" fill="currentColor"/></svg></button>
           <button id="kReset" data-tip="reset_tip">↺</button>
           <span id="kClock" class="k-clock"></span>
         </div>
         <span class="k-spacer"></span>
         <button id="kHood" data-t="hood" data-tip="hood_tip"></button>
         <button id="kFree" data-t="free" data-tip="free_tip"></button>
         <button id="kExport" data-t="export" data-tip="export_tip"></button>
         <button id="kLang" class="k-lang" data-t="lang_btn" data-tip="lang_tip"></button>
         <button id="kTheme" class="k-theme" data-tip="theme_tip"></button>
       </header>
       <main class="k-main">
         <div class="k-banner" id="kBanner" aria-live="polite"></div>
         <div class="k-split k-split-v" id="kSplitCols"></div>
         <section class="k-right">
           <div class="k-tabs" role="tablist">
             <button class="k-rtab active" role="tab" data-rtab="maquette" data-t="maquette"></button>
             <button class="k-rtab" role="tab" data-rtab="curves" data-t="curves"></button>
           </div>
           <div class="k-rpanes">
             <div class="k-maquette k-rpane active" data-rpane="maquette"><div class="k-view" id="kView"></div></div>
             <div class="k-curves k-rpane" data-rpane="curves"><canvas id="kChart"></canvas><div class="k-legend" id="kLegend"></div></div>
           </div>
         </section>
         <div class="k-split k-split-h" id="kSplitBanner"></div>
         <section class="k-left">
           <div class="k-tabs" role="tablist">
             <button class="k-tab" role="tab" data-tab="synoptic" data-t="tab_syn"></button>
             <button class="k-tab" role="tab" data-tab="panel" data-t="tab_panel"></button>
             <div class="k-tools" role="toolbar" data-tipl="tools">
               <button id="kToolClear" class="k-tool">${K.iconSvg("clearall", "k-ticon")}</button>
               <button id="kToolErase" class="k-tool">${K.iconSvg("eraser", "k-ticon")}</button>
               <span class="k-tsep"></span>
               <button id="kToolSnap" class="k-tool" aria-pressed="true">${K.iconSvg("grid", "k-ticon")}</button>
             </div>
           </div>
           <div class="k-panes">
             <div class="k-pane k-pane-panel" data-pane="panel"></div>
             <div class="k-pane k-pane-synoptic" data-pane="synoptic"></div>
           </div>
         </section>
       </main>
       <div class="k-toast" id="kToast" role="status"></div>`;
    const $ = sel => document.querySelector(sel);

    const S = { running: false, speed: 1, hood: false, free: false, tab: "synoptic", rtab: "maquette",
                pieces: new Set(), instruments: new Set(), log: [], t0: Date.now(),
                predictions: {}, answers: null, done: false };
    const model = new K.Model(W.skins);
    const log = (type, detail) => S.log.push({ t: +((Date.now() - S.t0) / 1000).toFixed(1), sim: +model.t.toFixed(3), type, detail: detail === undefined ? "" : detail });
    model.on(log);
    let toastTimer = null;
    const toast = msg => { const t = $("#kToast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800); };

    const app = { S, model, log, toast, W, clock: CLK, fmtSteps: CLK.fmtSteps };
    const changed = () => { app.panel.renderToolbar(); app.panel.update(); app.tutorial.refresh(); };
    app.synoptic = new K.Synoptic($('[data-pane="synoptic"]'), model, {
      order: W.order, home: W.home, fluxLabel: () => app.W.fluxLabel,
      isUnlocked: t => S.free || S.pieces.has(t), hood: () => S.hood, toast, onChange: changed });
    app.panel = new K.Panel($('[data-pane="panel"]'), model, {
      instruments: W.instruments, skins: W.skins,
      isUnlocked: k => (S.free || S.instruments.has(k)), toast, log, onChange: () => app.tutorial.refresh() });
    app.view = W.view($("#kView"), model, { log, toast, hood: () => S.hood, running: () => S.running });
    app.chart = new K.Chart($("#kChart"), model, Object.assign({}, W.chart, { legendEl: $("#kLegend"), app }));

    app.running = () => S.running;
    app.unlock = u => {
      (u.pieces || []).forEach(p => S.pieces.add(p));
      (u.instruments || []).forEach(i => S.instruments.add(i));
      app.synoptic.renderPalette(); app.panel.renderToolbar();
    };
    app.attention = tab => document.querySelectorAll(".k-tab").forEach(b => b.classList.toggle("attn", b.dataset.tab === tab && tab !== S.tab));
    app.goTab = tab => {
      S.tab = tab;
      document.querySelectorAll(".k-tab").forEach(b => { b.classList.toggle("active", b.dataset.tab === tab); b.setAttribute("aria-selected", b.dataset.tab === tab); });
      document.querySelectorAll(".k-pane").forEach(p => p.classList.toggle("active", p.dataset.pane === tab));
      if (tab === "synoptic") app.synoptic.render(); else app.panel.render();
      log("tab", tab); app.tutorial.refresh();
    };
    // right column: the scale model and the curves share one compartment, as two tabs
    app.goRTab = tab => {
      S.rtab = tab;
      document.querySelectorAll(".k-rtab").forEach(b => { b.classList.toggle("active", b.dataset.rtab === tab); b.setAttribute("aria-selected", b.dataset.rtab === tab); b.classList.remove("attn"); });
      document.querySelectorAll(".k-rpane").forEach(p => p.classList.toggle("active", p.dataset.rpane === tab));
      if (tab === "curves") app.chart.draw();
      log("rtab", tab);
    };
    // ---- toolbar of the bottom tabs: clear everything (two clicks), erase the selection, snap (Panel)
    let clearArmed = 0;
    $("#kToolClear").onclick = () => {
      if (Date.now() - clearArmed > 3000) { clearArmed = Date.now(); $("#kToolClear").classList.add("armed"); toast(K.t("tool_clear_confirm")); return; }
      clearArmed = 0; $("#kToolClear").classList.remove("armed");
      app.synoptic.clear(); app.panel.clear(); log("clear_all", ""); app.tutorial.refresh();
    };
    $("#kToolErase").onclick = () => { if (S.tab === "synoptic") app.synoptic.deleteSelected(); else app.panel.deleteSelected(); };
    $("#kToolSnap").onclick = () => app.panel.setSnap(!app.panel.snap);
    app.updateTools = () => {
      const syn = S.tab === "synoptic", e = $("#kToolErase"), sn = $("#kToolSnap"), c = $("#kToolClear");
      e.disabled = syn ? !app.synoptic.selected : !app.panel.controls.some(x => x.id === app.panel.selected);
      e.title = K.t(syn ? "tool_erase" : "tool_erase_pn");
      sn.hidden = syn; $(".k-tsep").hidden = syn; sn.classList.toggle("on", app.panel.snap); sn.setAttribute("aria-pressed", app.panel.snap); sn.title = K.t("tool_snap");
      c.title = K.t("tool_clear"); c.disabled = !model.nodes.length && !app.panel.controls.length;
      if (clearArmed && Date.now() - clearArmed > 3000) { clearArmed = 0; c.classList.remove("armed"); }
    };
    // the scale model fills its compartment: the drawing keeps its proportions (it is centred,
    // never stretched) and the viewBox grows to the compartment's shape, so the scene's
    // background runs to the edges with an equal margin on the four sides
    const fitView = () => {
      const host = $("#kView"), svg = host && host.querySelector("svg"); if (!svg) return;
      const r = host.getBoundingClientRect(); if (!r.width || !r.height) return;
      const key = Math.round(r.width) + "x" + Math.round(r.height); if (svg.dataset.fit === key) return;
      svg.dataset.fit = key;
      const [bx, by, bw, bh] = (svg.dataset.base || (svg.dataset.base = svg.getAttribute("viewBox"))).split(/[\s,]+/).map(Number);
      const s = Math.min(r.width / bw, r.height / bh), vw = r.width / s, vh = r.height / s;
      svg.setAttribute("viewBox", `${(bx - (vw - bw) / 2).toFixed(1)} ${(by - (vh - bh) / 2).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);
    };
    app.fitView = fitView;
    app.curvesHint = on => { const b = document.querySelector('.k-rtab[data-rtab="curves"]'); if (b) b.classList.toggle("attn", on && S.rtab !== "curves"); };
    app.goFree = () => {
      S.free = true; $("#kFree").classList.add("on");
      app.tutorial.mode = "free"; log("mode_free", "");
      app.synoptic.renderPalette(); app.panel.renderToolbar(); app.tutorial.render();
    };
    app.backToTutorial = () => {
      S.free = false; $("#kFree").classList.remove("on"); log("mode_tutorial", "");
      app.synoptic.renderPalette(); app.panel.renderToolbar();
      app.tutorial.start(S.done ? 0 : app.tutorial.i);
    };
    app.tutorial = new K.Tutorial($("#kBanner"), W, app);

    // ---- static labels, re-applied on a language switch
    const playLabel = () => { $("#kPlay").textContent = K.t(S.running ? "pause" : "play"); };
    function relabel() {
      document.title = app.W.pageTitle || app.W.title;
      $("#kTitle").textContent = app.W.title;
      $("#kHome").href = (app.W.homeUrl || "../index.html") + "?lang=" + K.lang;
      document.querySelectorAll("[data-t]").forEach(e => { e.textContent = K.t(e.dataset.t); });
      document.querySelectorAll("[data-tip]").forEach(e => { e.title = K.t(e.dataset.tip); });
      playLabel();
      if (app.showSpeed) app.showSpeed();
    }
    // Switching language rebuilds the workshop texts; the graph, the panel, the clock and
    // the tutorial progress are kept.
    app.setLang = lang => {
      K.setLang(lang);
      if (typeof factory === "function") {
        const W2 = build(factory);
        app.W = W2; model.skins = W2.skins;
        app.tutorial.W = W2; app.tutorial.steps = W2.steps;
        app.panel.o.instruments = W2.instruments; app.panel.o.skins = W2.skins;
        app.chart.o = Object.assign({}, W2.chart, { legendEl: $("#kLegend"), app });
      }
      log("lang", lang);
      relabel(); app.synoptic.relabel(); app.panel.relabel();
      app.synoptic.renderPalette(); app.synoptic.render(); app.synoptic.renderParams();
      app.panel.render(); app.tutorial.render();
      try { const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); } catch (e) { /* file:// or sandbox */ }
    };

    // ---- header controls
    const setPlay = on => { S.running = on; playLabel(); log(on ? "play" : "pause", ""); app.tutorial.refresh(); };
    $("#kPlay").onclick = () => setPlay(!S.running);
    // speed: the buttons step through SPEEDS; the label shows the speed in percent (100% =
    // the workshop's own pace), the tooltip how much simulated time one real second covers
    const num = v => (Math.round(v * 10) / 10).toString();
    const speedText = () => {
      const spr = CLK.stepsPerSec * S.speed * CLK.dt;          // model units per real second
      if (CLK.speedLabel) return CLK.speedLabel(spr, K.L);
      const r = 1 / spr;                                       // real seconds per simulated hour
      return r >= 1 ? `${num(r)} s = 1 h` : `1 s = ${num(spr)} h`;
    };
    const setSpeed = d => {
      const i = Math.max(0, Math.min(SPEEDS.length - 1, SPEEDS.indexOf(S.speed) + d));
      S.speed = SPEEDS[i]; showSpeed(); log("speed", S.speed);
      $("#kSlow").disabled = i === 0; $("#kFast").disabled = i === SPEEDS.length - 1;
    };
    const showSpeed = () => {
      const el = $("#kSpeed");
      el.textContent = `${K.t("speed")}: ${Math.round(S.speed * 100)}%`;
      el.title = `${K.t("speed_label")}: ${speedText()}`;
    };
    app.speedText = speedText; app.showSpeed = showSpeed;
    $("#kSlow").onclick = () => setSpeed(-1);
    $("#kFast").onclick = () => setSpeed(+1);

    // ---- splitters: drag to resize the compartments (double-click resets); remembered per browser
    // layout: top row = tutorial (left) + scale model / curves (right); bottom row, full width = Synoptic / Panel
    const main = $(".k-main");
    const layout = (() => { try { return JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {}; } catch (e) { return {}; } })();
    const applyLayout = () => {
      main.style.gridTemplateColumns = layout.cols ? `${layout.cols}px 6px minmax(300px,1fr)` : "";
      main.style.gridTemplateRows = layout.top ? `${layout.top}px 6px minmax(0,1fr)` : "";
    };
    const saveLayout = () => { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) { /* storage blocked */ } };
    const relayout = () => { app.synoptic.render(); app.panel.render(); app.chart.draw(); };
    function splitter(el, key, compute) {
      el.addEventListener("pointerdown", e => {
        e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("on");
        const move = ev => { layout[key] = Math.round(compute(ev)); applyLayout(); app.chart.draw(); };
        el.addEventListener("pointermove", move);
        el.addEventListener("pointerup", () => { el.removeEventListener("pointermove", move); el.classList.remove("on"); saveLayout(); relayout(); log("layout", key); }, { once: true });
      });
      el.addEventListener("dblclick", () => { delete layout[key]; applyLayout(); saveLayout(); relayout(); });
    }
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    splitter($("#kSplitCols"), "cols", ev => { const r = main.getBoundingClientRect(); return clamp(ev.clientX - r.left, 300, r.width - 306); });
    splitter($("#kSplitBanner"), "top", ev => { const r = main.getBoundingClientRect(); return clamp(ev.clientY - r.top, 140, r.height - 220); });
    applyLayout();
    $("#kReset").onclick = () => { model.resetAll(); app.tutorial.restartCurrent(); log("reset", ""); app.synoptic.render(); };
    $("#kHood").onclick = e => {
      S.hood = !S.hood; e.target.classList.toggle("on", S.hood); log("hood", S.hood);
      app.synoptic.renderPalette(); app.synoptic.render(); app.synoptic.renderParams(); app.tutorial.render();
    };
    $("#kFree").onclick = () => { if (!S.free) app.goFree(); };
    $("#kLang").onclick = () => app.setLang(K.lang === "fr" ? "en" : "fr");
    const themeIcon = () => { $("#kTheme").textContent = K.theme === "dark" ? "☀" : "☾"; };
    $("#kTheme").onclick = () => { K.setTheme(K.theme === "dark" ? "light" : "dark"); themeIcon(); log("theme", K.theme); app.synoptic.render(); app.chart.draw(); };
    themeIcon();
    $("#kExport").onclick = () => {
      const t = app.tutorial, Wn = app.W;
      const data = { tool: "TSCG Kit", workshop: Wn.id, version: VERSION, lang: K.lang, exported: new Date().toISOString(),
        progress: S.free ? "free" : t.mode === "final" ? "done" : t.steps[t.i].id,
        predictions: Object.fromEntries(Object.entries(S.predictions).map(([id, k]) => [id, Wn.steps.find(s => s.id === id).predict.choices[k]])),
        answers: S.answers,
        state: { graph: model.serialize(), panel: app.panel.serialize() },
        log: S.log };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `tscg-${Wn.id}-session-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      log("export", "");
    };
    document.querySelectorAll(".k-tab").forEach(b => b.onclick = () => app.goTab(b.dataset.tab));
    document.querySelectorAll(".k-rtab").forEach(b => b.onclick = () => app.goRTab(b.dataset.rtab));
    window.addEventListener("keydown", e => {
      const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if ((e.key === "Delete" || e.key === "Backspace") && !typing) { e.preventDefault(); if (S.tab === "synoptic") app.synoptic.deleteSelected(); else app.panel.deleteSelected(); }
      if (e.key === " " && !typing && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); setPlay(!S.running); }
    });

    // ---- main loop: accumulate real time, run whole simulation steps
    let last = performance.now(), acc = 0, chartT = 0;
    function frame(now) {
      const dt = Math.min(0.25, (now - last) / 1000); last = now;
      if (S.running) {
        acc += dt * CLK.stepsPerSec * S.speed;
        let guard = 0;
        while (acc >= 1 && guard++ < 600) { model.step(CLK.dt); app.tutorial.tick(); acc -= 1; }
      }
      app.synoptic.update(S.running); app.panel.update(); app.view.update(S.running); fitView(); app.tutorial.refresh(); app.updateTools();
      $("#kClock").textContent = CLK.fmt(model.t);
      if (now - chartT > 120) { app.chart.draw(); chartT = now; }
      requestAnimationFrame(frame);
    }

    setSpeed(0);
    app.step = n => { for (let i = 0; i < n; i++) { model.step(CLK.dt); app.tutorial.tick(); } };   // for tests
    relabel();
    app.synoptic.renderParams();
    app.goTab("synoptic");
    app.tutorial.start(0);
    requestAnimationFrame(frame);
    window.TSCG = app;            // handle for tests and for curious KitArchitects
    return app;
  };
  K.VERSION = VERSION;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>
/* workshop.js */
/* TSCG Kit — Larsen workshop definition
 * A room, a voice, an amplifier and a loudspeaker. Sound levels are an envelope
 * model (no waveform): the room absorbs, the loudspeaker re-injects what the
 * microphone picks up. Above a loop gain of 1 the loop feeds itself: Larsen.
 * Time unit: seconds, one step = 10 ms, shown in slow motion.
 * The definition is a factory: L(english, french) picks every text.
 * Author: Echopraxium with the collaboration of Claude AI
 */
(function (K) {
  "use strict";
  const syn = msg => ({ msg, tab: "synoptic" });
  const pan = msg => ({ msg, tab: "panel" });
  const lvl = app => { const r = app.model.first("salle"); return r ? r.s.x : 0; };
  const speaking = app => { const v = app.model.first("voix"); return !!(v && v.s.u); };
  const saturated = app => { const a = app.model.first("ampli"); return !!(a && a.s.sat); };
  const loopWired = m => m.linked("salle", "level", "ampli", "x") && m.linked("ampli", "y", "hp", "x") && m.linked("hp", "flow", "salle", "in");

  const factory = L => {
    const KEEP_LOOP = L("Keep the loop Room → Amp → Loudspeaker → Room.", "Garde la boucle Salle → Ampli → Haut-parleur → Salle.");
    return {
    id: "larsen",
    title: L("TSCG Workshop — Larsen", "Atelier TSCG — Larsen"),
    pageTitle: L("TSCG Workshop — Larsen", "TSCG Atelier — Larsen"),
    fluxLabel: L("flux (sound)", "flux (son)"),
    clock: { dt: 0.01, stepsPerSec: 25, fmt: t => t.toFixed(1) + " s", fmtSteps: n => (n * 0.01).toFixed(1) + " s",
             speedLabel: (spr, LL) => spr < 1 ? LL("slow motion ×", "ralenti ×") + Math.round(1 / spr * 10) / 10 : "×" + Math.round(spr * 10) / 10 },
    order: ["salle", "voix", "ampli", "hp"],
    home: { voix: { x: 16, y: 20 }, salle: { x: 206, y: 20 }, ampli: { x: 396, y: 170 }, hp: { x: 16, y: 170 } },

    skins: {
      salle: { kind: "storage", icon: "hall", name: L("Room", "Salle"), blurb: L("sound builds up, then dies out", "le son s'y accumule puis s'éteint"),
        ports: { in: L("sound in", "son reçu"), out: L("leak", "fuite"), level: L("picked up by the mic", "capté par le micro") },
        describe: n => K.L("level ", "niveau ") + n.s.x.toFixed(0),
        params: { decay: { label: L("Absorption (/s)", "Absorption (/s)"), v: 10, step: 1, min: 1, max: 40 },
                  C: { v: 1, hidden: true }, k: { v: 0, hidden: true }, x0: { v: 0, hidden: true },
                  base: { label: L("Ambient noise", "Bruit ambiant"), v: 0.5, step: 0.5, min: 0, max: 20 }, lo: { v: 0, hidden: true } } },
      voix: { kind: "source", icon: "voice", name: L("Voice", "Voix"), blurb: L("someone speaks", "quelqu'un parle"), onText: L("speaking", "parle"), offText: L("silent", "se tait"),
        ports: { cmd: L("command", "commande"), flow: L("sound", "son") },
        params: { P: { label: L("Voice strength", "Force de la voix"), v: 100, step: 10, min: 0, max: 300 } } },
      ampli: { kind: "amplify", icon: "amp", name: L("Amp", "Ampli"), blurb: L("multiplies the mic signal", "multiplie le signal du micro"),
        ports: { x: L("mic", "micro"), y: L("amplified", "amplifié") },
        describe: n => (n.s.sat ? K.L("saturated", "saturé") : "gain ×" + n.p.gain.toFixed(2)),
        params: { gain: { label: L("Volume (gain)", "Volume (gain)"), v: 0.3, step: 0.05, min: 0, max: 2.5 },
                  max: { label: L("Output ceiling", "Plafond de sortie"), v: 90, step: 5, min: 10, max: 200 } } },
      hp: { kind: "transducer", icon: "speaker", name: L("Loudspeaker", "Haut-parleur"), blurb: L("turns the signal into sound", "change le signal en son"),
        ports: { x: L("signal", "signal"), flow: L("sound", "son") },
        describe: n => (n.s.att < 1 ? K.L("mic far · ", "micro éloigné · ") : "") + K.L("sound ", "son ") + n.s.flow.toFixed(0),
        params: { k: { label: L("Efficiency", "Rendement"), v: 10, step: 1, min: 0, max: 30 }, max: { v: 5000, hidden: true }, noise: { v: 0, hidden: true } } }
    },

    instruments: {
      vumetre: { type: "gauge", label: L("Room level meter", "Vu-mètre de la salle"), short: L("Level", "Niveau"), bind: { piece: "salle", get: "level" }, range: [0, 100], decimals: 0, unit: "", zone: [18, 30] },
      parler:  { type: "toggle", label: L("Voice button", "Bouton de la voix"), short: L("Voice", "Voix"), bind: { piece: "voix", set: "manual" }, onText: L("speak", "parle"), offText: L("silence", "silence") },
      volume:  { type: "slider", label: L("Amp volume", "Volume de l'ampli"), short: "Volume", bind: { piece: "ampli", param: "gain" }, range: [0, 2.5], step: 0.05, decimals: 2, unit: "×" },
      sature:  { type: "lamp", label: L("Amp saturation light", "Témoin de saturation de l'ampli"), short: "Saturation", bind: { piece: "ampli", get: "sat" } }
    },

    chart: {
      range: [0, 100], tickY: 25, span: 4, unit: 1,
      series: [{ piece: "salle", label: L("Level in the room", "Niveau dans la salle"), color: "--flux", decimals: 0 }],
      strips: [
        { label: L("voice", "voix"), color: "--info", on: (p, m) => { const v = m.first("voix"); return !!(v && p.u[v.id]); } },
        { label: L("amp saturated", "ampli saturé"), color: "--bad", on: (p, m) => { const a = m.first("ampli"); return !!(a && p.u[a.id]); } }
      ]
    },

    steps: [
      { id: "talk", title: L("Speaking in the room", "Parler dans la salle"),
        unlock: { pieces: ["salle", "voix"], instruments: ["vumetre", "parler"] },
        goal: L("In the <b>Synoptic</b>, place a <b>Room</b> and a <b>Voice</b>, and wire the Voice's <i>sound</i> to the Room. In the <b>Panel</b>, add the <b>level meter</b> and the <b>voice button</b>. Start the time, speak for a moment, then fall silent.",
                "Dans le <b>Synoptique</b>, pose une <b>Salle</b> et une <b>Voix</b>, et relie le <i>son</i> de la Voix à la Salle. Dans le <b>Panneau</b>, ajoute le <b>vu-mètre</b> et le <b>bouton de la voix</b>. Lance le temps, parle un instant, puis tais-toi."),
        need: app => { const m = app.model;
          return !m.first("salle") || !m.first("voix") ? syn(L("Place a Room and a Voice in the Synoptic.", "Pose une Salle et une Voix dans le Synoptique.")) :
                 !m.linked("voix", "flow", "salle", "in") ? syn(L("Wire the Voice's sound to the Room.", "Relie le son de la Voix à la Salle.")) :
                 !app.panel.has("vumetre") ? pan(L("Add the level meter in the Panel.", "Ajoute le vu-mètre dans le Panneau.")) :
                 !app.panel.has("parler") ? pan(L("Add the voice button in the Panel.", "Ajoute le bouton de la voix dans le Panneau.")) : null; },
        check: (app, mem) => {
          if (speaking(app)) mem.spoke = (mem.spoke || 0) + 1;
          const s = mem.spoke || 0;
          if (s < 30) return { p: 0.5 * s / 30, done: false, status: s ? L("Keep speaking a moment…", "Continue de parler un instant…") : L("Click the voice button to speak.", "Clique sur le bouton de la voix pour parler.") };
          if (speaking(app)) return { p: 0.5, done: false, status: L("Now fall silent (click the button again).", "Maintenant, tais-toi (clique à nouveau sur le bouton).") };
          return { p: lvl(app) < 1 ? 1 : 0.75, done: lvl(app) < 1, status: L("Listen to the level dropping…", "Écoute le niveau retomber…") };
        },
        takeaway: L("When you speak, the level rises then settles. When you stop, it falls back by itself: the room absorbs sound. Silence is the state it always returns to.",
                    "Quand tu parles, le niveau monte puis se stabilise. Quand tu te tais, il retombe tout seul : la salle absorbe le son. Le silence est l'état vers lequel elle revient toujours."),
        hood: L("Room = <b>Storage</b> that empties itself (absorption). Voice = <b>Source</b>.", "Salle = <b>Storage</b> qui se vide d'elle-même (absorption). Voix = <b>Source</b>.") },

      { id: "amplify", title: L("Adding a PA", "Sonoriser"),
        unlock: { pieces: ["ampli", "hp"], instruments: ["volume"] },
        goal: L("Place an <b>Amp</b> and a <b>Loudspeaker</b>. Wire what the Room <i>picks up by the mic</i> to the Amp, the Amp to the Loudspeaker, and the Loudspeaker's <i>sound</i> to the Room. Add the <b>volume slider</b>. Then, while speaking, bring the level meter into the green zone and hold one second.",
                "Pose un <b>Ampli</b> et un <b>Haut-parleur</b>. Relie ce que la Salle <i>capte par le micro</i> à l'Ampli, l'Ampli au Haut-parleur, et le <i>son</i> du Haut-parleur à la Salle. Ajoute le <b>curseur de volume</b>. Puis, en parlant, amène le vu-mètre dans la zone verte et tiens une seconde."),
        hint: L("Turn the volume up gently.", "Monte le volume doucement."),
        need: app => { const m = app.model;
          return !m.first("ampli") || !m.first("hp") ? syn(L("Place an Amp and a Loudspeaker.", "Pose un Ampli et un Haut-parleur.")) :
                 !m.linked("salle", "level", "ampli", "x") ? syn(L("Wire what the mic picks up (Room) to the Amp.", "Relie ce que capte le micro (Salle) à l'Ampli.")) :
                 !m.linked("ampli", "y", "hp", "x") ? syn(L("Wire the Amp to the Loudspeaker.", "Relie l'Ampli au Haut-parleur.")) :
                 !m.linked("hp", "flow", "salle", "in") ? syn(L("Wire the Loudspeaker's sound to the Room.", "Relie le son du Haut-parleur à la Salle.")) :
                 !app.panel.has("volume") ? pan(L("Add the volume slider in the Panel.", "Ajoute le curseur de volume dans le Panneau.")) : null; },
        check: (app, mem) => {
          const ok = speaking(app) && lvl(app) >= 18 && lvl(app) <= 30 && !saturated(app);
          mem.n = ok ? (mem.n || 0) + 1 : 0;
          return { p: mem.n / 100, done: mem.n >= 100,
            status: !speaking(app) ? L("Speak (voice button) to fill the room.", "Parle (bouton de la voix) pour remplir la salle.") :
                    ok ? L("Hold on… ", "Tiens bon… ") + `${app.fmtSteps(mem.n)} / 1.0 s` :
                    lvl(app) < 18 ? L("Not loud enough: turn the volume up a little.", "Pas assez fort : monte un peu le volume.") : L("Too loud: turn the volume down a little.", "Trop fort : baisse un peu le volume.") };
        },
        takeaway: L("Your voice carries further: the loudspeaker sends back into the room what the mic picks up, which is picked up again, sent back… The output comes back to reinforce the input. For now, each round trip gives back less than it receives, and all stays calm.",
                    "Ta voix porte plus loin : le haut-parleur renvoie dans la salle ce que le micro capte, qui est capté à nouveau, renvoyé… La sortie revient renforcer l'entrée. Pour l'instant, chaque tour rend moins qu'il ne reçoit, et tout reste calme."),
        hood: L("Amp = <b>Amplification</b>. Loudspeaker = <b>Transducer</b> (signal → sound). The path Room → Amp → Loudspeaker → Room forms a positive <b>Feedback Loop</b>.",
                "Ampli = <b>Amplification</b>. Haut-parleur = <b>Transducer</b> (signal → son). Le chemin Salle → Ampli → Haut-parleur → Salle forme une <b>Feedback Loop</b> positive.") },

      { id: "whistle", title: L("The howl", "Le sifflement"),
        unlock: { instruments: ["sature"] },
        predict: { q: L("Before trying: if you turn the volume up further, then fall silent, what will happen?", "Avant d'essayer : si tu montes encore le volume, puis que tu te tais, que va-t-il se passer ?"),
                   choices: [L("The sound fades, as before", "Le son retombe, comme avant"), L("The sound stays a bit louder", "Le son reste un peu plus fort"), L("It howls, and it does not stop", "Ça siffle, et ça ne s'arrête plus")] },
        goal: L("Add the <b>saturation light</b>. Turn the volume up little by little, then fall silent. Watch the level meter, the scale model… and listen.",
                "Ajoute le <b>témoin de saturation</b>. Monte le volume petit à petit, puis tais-toi. Observe le vu-mètre, la Maquette… et écoute."),
        hint: L("The scale model's sound is muted with the small speaker icon at the top right.", "Le son de la Maquette se coupe avec le petit haut-parleur en haut à droite."),
        need: app => !loopWired(app.model) ? syn(KEEP_LOOP) :
                     !app.panel.has("sature") ? pan(L("Add the saturation light in the Panel.", "Ajoute le témoin de saturation dans le Panneau.")) : null,
        check: (app, mem) => {
          const ok = !speaking(app) && saturated(app);
          mem.n = ok ? (mem.n || 0) + 1 : 0;
          return { p: mem.n / 100, done: mem.n >= 100,
            status: speaking(app) ? L("Fall silent, to see what the loop does on its own.", "Tais-toi, pour voir ce que fait la boucle toute seule.") :
                    ok ? L("It holds on its own… ", "Ça tient tout seul… ") + `${app.fmtSteps(mem.n)} / 1.0 s` : L("Turn the volume up again, gently.", "Monte encore le volume, doucement.") };
        },
        takeaway: L("Beyond a certain volume, the loop sustains itself: no need to speak any more, the slightest noise is enough to start it. Only the amp's ceiling stops it. That is the Larsen effect.",
                    "Au-delà d'un certain volume, la boucle s'entretient d'elle-même : plus besoin de parler, le moindre bruit suffit à la lancer. Seul le plafond de l'ampli l'arrête. C'est l'effet Larsen."),
        hood: L("The threshold is when one round trip gives back as much as it receives (loop gain = 1). There is no “threshold” block: it is born from the wiring.",
                "Le seuil, c'est quand un tour de boucle rend autant qu'il reçoit (gain de boucle = 1). Il n'y a pas de bloc « seuil » : il naît du câblage.") },

      { id: "distance", title: L("Moving the mic away", "Éloigner le micro"),
        goal: L("Leave the volume above the threshold. In the <b>scale model</b>, click the <b>mic</b> to move it away from the loudspeaker. Does the howl stop?",
                "Laisse le volume au-dessus du seuil. Dans la <b>Maquette</b>, clique sur le <b>micro</b> pour l'éloigner du haut-parleur. Le sifflement s'arrête-t-il ?"),
        need: app => { const a = app.model.first("ampli");
          return !loopWired(app.model) ? syn(KEEP_LOOP) :
                 a.p.gain < 1.05 ? pan(L("First turn the volume back up to the howl (above ×1).", "Remonte d'abord le volume jusqu'au sifflement (au-dessus de ×1).")) : null; },
        check: (app, mem) => {
          const hp = app.model.first("hp"), far = hp && hp.s.att < 1;
          const ok = far && !speaking(app) && lvl(app) < 2;
          mem.n = ok ? (mem.n || 0) + 1 : 0;
          return { p: mem.n / 100, done: mem.n >= 100,
            status: !far ? L("Click the mic, in the scale model on the right.", "Clique sur le micro, dans la Maquette à droite.") :
                    speaking(app) ? L("Fall silent to listen.", "Tais-toi pour écouter.") :
                    ok ? L("Calm returns… ", "Le calme revient… ") + `${app.fmtSteps(mem.n)} / 1.0 s` : L("Still howling: turn the volume down a little if needed.", "Ça siffle encore : baisse un peu le volume si besoin.") };
        },
        takeaway: L("The howl dies out without touching the volume. The threshold does not depend on a single block but on the whole round trip, including the distance between mic and loudspeaker, which the Panel does not control.",
                    "Le sifflement s'éteint sans toucher au volume. Le seuil ne dépend pas d'un seul bloc mais de tout le tour de boucle, y compris de la distance entre le micro et le haut-parleur, que le Panneau ne règle pas."),
        hood: L("Loop gain = volume × efficiency × mic/loudspeaker coupling. The same volume can be tame or explosive depending on the rest of the circuit.",
                "Gain de boucle = volume × rendement × couplage micro/haut-parleur. Le même volume peut être sage ou explosif selon le reste du circuit.") }
    ],

    final: {
      title: L("You tamed the Larsen effect", "Tu as dompté le Larsen"),
      text: L("Wherever an output comes back to reinforce its input, there is a threshold beyond which everything runs away: a rumour going viral, a bank run, applause speeding up, an arms race. And often it is an outside ceiling, not the loop itself, that finally stops it.",
              "Partout où une sortie revient renforcer son entrée, il existe un seuil au-delà duquel tout s'emballe : une rumeur qui devient virale, une panique bancaire, des applaudissements qui s'accélèrent, une course aux armements. Et souvent, c'est un plafond extérieur, pas la boucle elle-même, qui finit par l'arrêter."),
      questions: [],
      hood: L("The Thermostat showed a loop that corrects (negative). Larsen shows a loop that reinforces (positive). Both are made of the same wires.",
              "Le Thermostat montrait une boucle qui corrige (négative). Larsen montre une boucle qui renforce (positive). Les deux sont faites des mêmes fils.")
    },

    free: {
      text: L("Every block is unlocked. Try: does a more absorbent room (less reverberation) take more volume? What happens with a higher amp ceiling? Can you trigger the Larsen without ever speaking, with ambient noise alone?",
              "Tous les blocs sont débloqués. Essaie : une salle plus absorbante (moins de réverbération) supporte-t-elle plus de volume ? Que se passe-t-il si le plafond de l'ampli est plus haut ? Peux-tu provoquer le Larsen sans jamais parler, avec le seul bruit ambiant ?"),
      hood: L("Generic blocks used: Storage, Source, Amplification, Transducer.", "Blocs génériques utilisés : Storage, Source, Amplification, Transducer.")
    },

    // ---------------------------------------------------------------- scale model
    view: function (host, model, api) {
      const arcs = (cx, cy, n, cls) => Array.from({ length: n }, (_, i) =>
        `<path class="${cls}" data-i="${i}" d="M${cx} ${cy - 14 - i * 12} A ${16 + i * 12} ${16 + i * 12} 0 0 0 ${cx} ${cy + 14 + i * 12}" fill="none" stroke-width="2.5" stroke-linecap="round"/>`).join("");
      host.innerHTML = `
<svg viewBox="0 0 440 300" role="img" preserveAspectRatio="xMidYMid meet">
  <rect x="-1500" width="3440" y="-1500" height="3300" fill="#2b2a33"/>
  <rect id="lxAir" x="-1500" y="-1500" width="3440" height="1752"/>
  <rect x="-1500" y="252" width="3440" height="1500" fill="#5a4636"/>
  <g id="lxPerson">
    <circle cx="70" cy="150" r="13" fill="#e9c9a6"/>
    <path d="M52 252 V190 Q52 172 70 172 Q88 172 88 190 V252 Z" fill="#4f6d8f"/>
    <g id="lxSpeech" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0">
      <path d="M90 140 q6 10 0 20"/><path d="M98 134 q9 16 0 32"/>
    </g>
  </g>
  <g id="lxMic" class="mq-click">
    <rect id="lxMicHit" x="0" y="0" width="40" height="150" fill="transparent"/>
    <line x1="20" y1="40" x2="20" y2="148" stroke="#b9b6ad" stroke-width="3"/>
    <line x1="8" y1="150" x2="32" y2="150" stroke="#b9b6ad" stroke-width="4" stroke-linecap="round"/>
    <rect x="13" y="16" width="14" height="26" rx="7" fill="#d8d5cc" stroke="#8a877e" stroke-width="1.5"/>
  </g>
  <g id="lxSpk">
    <rect x="352" y="96" width="56" height="96" rx="6" fill="#1d1c22" stroke="#77736a" stroke-width="2"/>
    <circle cx="380" cy="122" r="10" fill="#3a3942" stroke="#77736a"/>
    <circle id="lxCone" cx="380" cy="164" r="18" fill="#3a3942" stroke="#77736a" stroke-width="2"/>
    <line x1="380" y1="192" x2="380" y2="252" stroke="#77736a" stroke-width="4"/>
    <g id="lxWaves">${arcs(344, 160, 6, "lxArc")}</g>
  </g>
  <g id="lxMute" class="mq-click" transform="translate(396 24)">
    <rect width="28" height="24" rx="6" fill="#3a3942"/>
    <path d="M7 9 h4 l5 -4 v14 l-5 -4 h-4 z" fill="#d8d5cc"/>
    <path id="lxMuteOn" d="M19 8 q4 4 0 8" stroke="#d8d5cc" stroke-width="1.8" fill="none"/>
    <path id="lxMuteOff" d="M18 8 l6 8 M24 8 l-6 8" stroke="#e2685a" stroke-width="1.8"/>
  </g>
  <text id="lxEmpty" class="mq-note" x="220" y="150" text-anchor="middle" style="fill:#d8d5cc"></text>
</svg>`;
      const $ = id => host.querySelector("#" + id);
      const NEAR = 250, FAR = 150;
      let micX = NEAR, muted = false, audio = null;
      const ease = { lvl: 0, cone: 0 };

      function ensureAudio() {
        if (audio || muted) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          const ctx = new AC(), osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = "sine"; osc.frequency.value = 2200; gain.gain.value = 0;
          osc.connect(gain).connect(ctx.destination); osc.start();
          audio = { ctx, osc, gain };
        } catch (e) { audio = null; }
      }
      document.addEventListener("pointerdown", ensureAudio);
      $("lxMute").addEventListener("click", () => { muted = !muted; api.log("mute", muted); if (!muted) ensureAudio(); });
      $("lxMic").addEventListener("click", () => {
        const hp = model.first("hp");
        if (!hp) { api.toast(K.L("The mic only matters once there is a loudspeaker: place it in the Synoptic.", "Le micro ne compte que s'il y a un haut-parleur : pose-le dans le Synoptique.")); return; }
        hp.s.att = hp.s.att < 1 ? 1 : 0.5;
        api.log("mic", hp.s.att < 1 ? "far" : "near");
      });

      return {
        update(running) {
          const salle = model.first("salle"), voix = model.first("voix"), hp = model.first("hp"), ampli = model.first("ampli");
          host.querySelector("svg").setAttribute("aria-label", K.L("Scale model: a room with a PA system", "Maquette : une salle sonorisée"));
          $("lxEmpty").textContent = K.L("Empty room: place a Room in the Synoptic.", "Salle vide : pose une Salle dans le Synoptique.");
          $("lxEmpty").style.display = salle ? "none" : "";
          const Lv = salle ? salle.s.x : 0;
          ease.lvl += (Lv - ease.lvl) * 0.2;
          const f = Math.max(0, Math.min(1, ease.lvl / 100)), sat = !!(ampli && ampli.s.sat);
          $("lxAir").setAttribute("fill", salle ? `rgb(${Math.round(58 + 120 * f * (sat ? 1 : .5))},${Math.round(56 + 20 * f)},${Math.round(70 + 10 * f)})` : "#3a3942");
          $("lxPerson").style.display = voix && salle ? "" : "none";
          $("lxSpeech").setAttribute("opacity", voix && voix.s.u ? 0.9 : 0);
          $("lxMic").style.display = salle ? "" : "none";
          const far = !!(hp && hp.s.att < 1);
          micX += ((far ? FAR : NEAR) - micX) * 0.15;
          $("lxMic").setAttribute("transform", `translate(${(micX - 20).toFixed(1)} 98)`);
          $("lxSpk").style.display = hp ? "" : "none";
          if (hp) {
            const out = Math.max(0, Math.min(1, (hp.s.flow || 0) / 900));
            ease.cone = running ? Math.sin(performance.now() / (sat ? 18 : 60)) * out : 0;
            $("lxCone").setAttribute("r", (18 + 2.5 * ease.cone).toFixed(2));
            host.querySelectorAll(".lxArc").forEach(a => {
              const i = +a.dataset.i, on = out > i / 6 + 0.01;
              a.setAttribute("stroke", sat ? "#ff8a3d" : "#cfd8e6");
              a.setAttribute("opacity", on ? (0.85 - i * 0.1).toFixed(2) : 0);
            });
          }
          $("lxMuteOn").style.display = muted ? "none" : ""; $("lxMuteOff").style.display = muted ? "" : "none";
          if (audio) {
            const loud = !muted && running && hp ? Math.max(0, Math.min(1, (Lv - 30) / 60)) : 0;
            audio.gain.gain.setTargetAtTime(0.05 * loud, audio.ctx.currentTime, 0.05);
            audio.osc.frequency.setTargetAtTime(far ? 2600 : 2100, audio.ctx.currentTime, 0.2);
          }
        }
      };
    }
  };
  };

  // Place on the map of scenarios: an articulation from the pivot (read by the home page, without the libraries)
  factory.meta = { icon: "speaker",
    name: { en: "Larsen", fr: "Larsen" },
    what: { en: "A room, a voice, an amp, a loudspeaker.", fr: "Une salle, une voix, un ampli, un haut-parleur." },
    concept: { en: "A loop that reinforces: beyond a threshold, everything runs away.", fr: "Une boucle qui renforce : au-delà d'un seuil, tout s'emballe." },
    articulation: { from: "thermostat", dir: "lateral",
      carried: { en: "the loop", fr: "la boucle" },
      change: { en: "the loop changes sign", fr: "la boucle change de signe" } } };
  (K.workshops = K.workshops || {}).larsen = factory;
})(window.TSCGKit = window.TSCGKit || {});

</script>
<script>TSCGKit.start(TSCGKit.workshops.larsen);</script>
</body>
