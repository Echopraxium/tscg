  generated: "2026-08-08"
  status_vocab: [done, design-decided, scoped, staged, todo, partial, blocked]
  gauge_note: >
    current: <n> = measured & reliable (source in measured_by).
    current: null = not reliably measurable yet; measured_by names the validator
    family that will provide it. NEVER put a raw git-grep count here — scope/prose
    discipline (proven on CTX) is required first.

