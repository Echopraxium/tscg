# TSCG Worksite — structured state layer
#
# Author: Echopraxium with the collaboration of Claude AI
# This YAML is the SOURCE OF TRUTH for worksite STATE. The narrative map
# (_00_TSCG_Worksite_Map.md) is derived from it / kept beside it: lessons,
# rationales and the deprecated-term / notation-migration stories stay in prose,
# NOT here.
#
# Scope of this file = the STATE LAYER only (design spec of the Map/Territory
# split applied to our own process): what exists, its status, and the gauge each
# item drives toward a target. Anything a human reads as narrative is out of scope.
#
# Addressing (from map §1): WS-n / sub-item / step. sub-item taxonomies are per
# worksite (SC-n, CTX-n, VOC, …) and are NEVER renumbered.

